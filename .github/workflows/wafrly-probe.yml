# Wafrly: one-off check of which offer websites load from a GitHub runner (no secrets needed).
name: Wafrly source probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python ration/collector/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: probe-out
