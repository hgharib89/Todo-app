# Wafrly: one-off check of which offer websites load from a GitHub runner (no secrets needed).
name: Wafrly source probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python ration/collector/discover.py
      - name: Save results to the wafrly-probe branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r probe-out/. /tmp/out/
          git config user.name "wafrly-bot" && git config user.email "actions@users.noreply.github.com"
          git checkout --orphan wafrly-probe && git rm -rfq . && cp -r /tmp/out/. . && git add -A
          git commit -qm "probe results" && git push -f origin wafrly-probe
