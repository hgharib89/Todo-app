# Builds the Kout game (kout/) and publishes the whole site to GitHub Pages:
#   /            → the existing static files in the repo root (to-do app, hawwi/, …)
#   /kout/       → the built Kout game
# To use it: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy site (with Kout) to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kout/package-lock.json
      - name: Install, test and build Kout
        working-directory: kout
        env:
          # the online game server address (repo Settings → Secrets and variables → Actions → Variables)
          # KOUT_SERVER_URL if set, else https://<FLY_APP>.fly.dev when the FLY_APP variable is set
          VITE_KOUT_SERVER: ${{ vars.KOUT_SERVER_URL || (vars.FLY_APP && format('https://{0}.fly.dev', vars.FLY_APP)) || '' }}
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'kout' ./ _site/
          mkdir -p _site/kout
          cp -r kout/dist/. _site/kout/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
