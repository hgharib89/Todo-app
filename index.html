<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المهام</title>
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="المهام">
<style>
  :root {
    color-scheme: light dark;
    --bg: #F6F7F9;
    --surface: #FFFFFF;
    --surface-hover: #F1F3F5;
    --border: #E3E6EA;
    --border-strong: #C4CAD1;
    --text: #1F2328;
    --text-muted: #5F6B76;
    --accent: #2563EB;
    --accent-hover: #1D4ED8;
    --on-accent: #FFFFFF;
    --accent-soft: #E8EFFD;
    --accent-text: #1D4ED8;
    --success: #16A34A;
    --on-success: #FFFFFF;
    --danger: #C62828;
    --danger-soft: #FDECEC;
    --focus-ring: #2563EB66;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --shadow-card: 0 1px 2px rgba(16,24,40,.06), 0 4px 12px rgba(16,24,40,.06);
    --ease: 150ms ease-out;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1115;
      --surface: #181B21;
      --surface-hover: #20242B;
      --border: #2A2F37;
      --border-strong: #3E4550;
      --text: #E6E8EB;
      --text-muted: #9BA3AE;
      --accent: #60A5FA;
      --accent-hover: #93C5FD;
      --on-accent: #0B1220;
      --accent-soft: #1B2A44;
      --accent-text: #93C5FD;
      --success: #22C55E;
      --on-success: #0B1220;
      --danger: #F87171;
      --danger-soft: #3A1D1F;
      --focus-ring: #60A5FA80;
      --shadow-card: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    overflow-x: hidden;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  button, input, .box, .box svg, .item, .text {
    transition: background-color var(--ease), color var(--ease), border-color var(--ease),
                opacity var(--ease), transform var(--ease);
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .visually-hidden {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0);
    white-space: nowrap; border: 0;
  }

  /* Layout */
  .page {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 16px 48px;
  }
  .app-header {
    padding: calc(24px + env(safe-area-inset-top)) 0 16px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .lang-btn {
    flex: none;
    height: 36px;
    min-width: 44px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .lang-btn:hover { border-color: var(--border-strong); }
  .lang-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }
  .subtitle {
    margin: 4px 0 0;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
  }

  /* Input row */
  .new-form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .field {
    flex: 1;
    min-width: 0;
    height: 44px;
    padding: 0 12px;
    font-size: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
  }
  .field::placeholder { color: var(--text-muted); opacity: 1; }
  .field:hover { border-color: var(--border-strong); }
  .field:focus, .field:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--focus-ring);
  }
  .add-btn {
    flex: none;
    height: 44px;
    padding: 0 16px;
    border: 0;
    border-radius: var(--radius-md);
    background: var(--accent);
    color: var(--on-accent);
    font-size: 15px;
    font-weight: 600;
  }
  .add-btn:not([aria-disabled="true"]):hover { background: var(--accent-hover); }
  .add-btn:not([aria-disabled="true"]):active { transform: scale(0.98); }
  .add-btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; }
  .mic-btn {
    flex: none;
    width: 44px;
    height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
  }
  .loc-row { display: flex; gap: 8px; flex: 1 1 100%; }
  .loc-field { height: 40px; font-size: 15px; }
  .locate-btn { height: 40px; width: 40px; }
  .locate-btn.busy { opacity: .6; pointer-events: none; }
  .body { flex: 1; min-width: 0; }
  .loc {
    display: flex;
    width: fit-content;
    align-items: center;
    gap: 4px;
    margin-top: 2px;
    font-size: 13px;
    color: var(--accent-text);
    text-decoration: none;
    overflow-wrap: anywhere;
  }
  .loc[hidden], .mic-btn[hidden] { display: none; }
  .loc svg { width: 13px; height: 13px; flex: none; }
  .loc:hover { text-decoration: underline; }
  .mic-btn:hover { border-color: var(--border-strong); color: var(--text); }
  .mic-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mic-btn.listening {
    background: var(--danger);
    border-color: var(--danger);
    color: #FFFFFF;
    animation: mic-pulse 1.2s ease-in-out infinite;
  }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(198,40,40,.45); }
    50% { box-shadow: 0 0 0 6px rgba(198,40,40,0); }
  }
  @media (prefers-reduced-motion: reduce) { .mic-btn.listening { animation: none; } }

  /* Empty states */
  .empty {
    padding: 48px 16px;
    text-align: center;
  }
  .empty svg { display: block; margin: 0 auto; color: var(--text-muted); }
  .empty-title { margin: 12px 0 0; font-size: 16px; font-weight: 600; }
  .empty-text { margin: 4px 0 0; font-size: 14px; color: var(--text-muted); }
  .filter-empty {
    margin: 0;
    padding: 32px 16px;
    text-align: center;
    font-size: 14px;
    color: var(--text-muted);
  }

  /* List */
  .list { list-style: none; margin: 0; padding: 0; }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 52px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .item:last-child { border-bottom: 0; }
  .item { flex-wrap: wrap; }
  .icon-btn.notes-btn { width: auto; min-width: 32px; padding: 0 6px; gap: 3px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; }
  .notes-btn .count:empty { display: none; }
  .notes-btn[aria-expanded="true"], .notes-btn.has-notes { color: var(--accent-text); }
  .notes-btn:hover { color: var(--accent); background: var(--surface-hover); }
  .notes {
    flex: 0 0 auto;
    width: calc(100% - 34px);
    box-sizing: border-box;
    margin-inline-start: 34px;
    padding: 8px 12px 10px;
    border-inline-start: 2px solid var(--accent-soft);
  }
  .note-list { list-style: none; margin: 0 0 8px; padding: 0; }
  .note-list:empty { display: none; }
  .note {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 4px 0;
    font-size: 14px;
    color: var(--text);
  }
  .note::before { content: "•"; color: var(--accent); font-weight: 700; flex: none; }
  .note-text { flex: 1; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .note-del, .note-edit { width: 24px; height: 24px; flex: none; }
  .note-del svg, .note-edit svg { width: 14px; height: 14px; }
  .note-edit:hover { color: var(--accent); background: var(--surface-hover); }
  .note-text { cursor: text; }
  .note-input { flex: 1; min-width: 0; height: 34px; font-size: 14px; padding: 0 8px; }
  .note-del:hover { color: var(--danger); background: var(--danger-soft); }
  .note-form { display: flex; gap: 6px; }
  .note-field { height: 38px; font-size: 15px; }
  .note-form .mic-btn { width: 38px; height: 38px; }
  .note-form .mic-btn svg { width: 18px; height: 18px; }
  .note-form .field { flex: 1; min-width: 0; }
  .note-add { height: 38px; padding: 0 12px; font-size: 14px; }
  .item:hover { background: var(--surface-hover); }
  .item.editing, .item.editing:hover { background: var(--surface); }
  .item.enter { animation: item-enter 150ms ease-out; }
  .item.leaving { animation: item-leave 120ms ease-out forwards; pointer-events: none; }
  @keyframes item-enter { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  @keyframes item-leave { to { opacity: 0; } }

  /* Checkbox */
  .check {
    position: relative;
    flex: none;
    width: 22px;
    height: 22px;
  }
  .check input {
    position: absolute;
    top: -11px; left: -11px;
    width: 44px; height: 44px;
    margin: 0;
    opacity: 0;
    cursor: pointer;
    z-index: 1;
  }
  .box {
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border: 2px solid var(--text-muted);
    border-radius: 50%;
    background: transparent;
  }
  .box svg {
    width: 12px; height: 12px;
    opacity: 0;
    transform: scale(0.6);
    color: var(--on-success);
  }
  .check:hover .box { border-color: var(--success); }
  .check input:checked + .box { background: var(--success); border-color: var(--success); }
  .check input:checked + .box svg { opacity: 1; transform: scale(1); }
  .check input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Text */
  .text {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    font-weight: 400;
    color: var(--text);
    overflow-wrap: anywhere;
  }
  .text.noselect { user-select: none; -webkit-user-select: none; }
  .item.done .text { color: var(--text-muted); text-decoration: line-through; }

  /* Icon buttons */
  .icon-btn {
    position: relative;
    flex: none;
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-muted);
  }
  .icon-btn::before { content: ""; position: absolute; inset: -6px; }
  .icon-btn svg { width: 18px; height: 18px; }
  .del-btn:hover { color: var(--danger); background: var(--danger-soft); }
  .edit-btn:hover { color: var(--accent); background: var(--surface-hover); }
  .edit-btn { display: none; }
  @media (hover: none) {
    .edit-btn { display: grid; }
  }
  @media (hover: hover) {
    .del-btn { opacity: 0; }
    .item:hover .del-btn, .item:focus-within .del-btn { opacity: 1; }
  }

  /* Edit mode */
  .edit { display: none; }
  .item.editing .check,
  .item.editing .body,
  .item.editing .notes,
  .item.editing .icon-btn { display: none; }
  .item.editing .edit { display: block; margin-inline-start: 34px; }

  /* Filter bar */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-top: 1px solid var(--border);
  }
  .filters { display: flex; gap: 4px; }
  .filter-btn, .clear-btn {
    position: relative;
    height: 32px;
    padding: 0 12px;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 500;
  }
  .filter-btn::before, .clear-btn::before { content: ""; position: absolute; inset: -6px 0; }
  .filter-btn:hover { color: var(--text); background: var(--surface-hover); }
  .filter-btn[aria-pressed="true"],
  .filter-btn[aria-pressed="true"]:hover {
    background: var(--accent-soft);
    color: var(--accent-text);
    font-weight: 600;
  }
  .clear-btn { margin-inline-start: auto; }
  .clear-btn:hover { color: var(--danger); text-decoration: underline; }
  .clear-btn.is-hidden { visibility: hidden; }

  /* Footer */
  .app-footer {
    margin-top: 12px;
    text-align: center;
  }
  .counter {
    margin: 0;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .hint { margin: 0; font-size: 12px; color: var(--text-muted); }

  @media (min-width: 480px) {
    .page { padding: 48px 24px 48px; }
    .app-header { padding-top: calc(32px + env(safe-area-inset-top)); }
    .app-footer { text-align: start; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0ms !important;
      animation-duration: 0ms !important;
    }
  }
</style>
</head>
<body>
<main class="page">
  <header class="app-header">
    <div>
      <h1 data-i18n="title">المهام</h1>
      <p class="subtitle" id="subtitle">لا توجد مهام</p>
    </div>
    <button type="button" class="lang-btn" id="lang-btn" lang="en" aria-label="Switch to English">EN</button>
  </header>

  <section class="card">
    <form class="new-form" id="new-form" autocomplete="off">
      <label for="new-input" class="visually-hidden" data-i18n="newTask">مهمة جديدة</label>
      <input class="field" id="new-input" type="text" maxlength="200" placeholder="ماذا تريد أن تنجز؟" data-i18n-ph="placeholder" dir="auto">
      <button class="mic-btn" id="mic-btn" type="button" aria-label="إملاء المهمة" aria-pressed="false" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
      </button>
      <button class="add-btn" id="add-btn" type="submit" aria-disabled="true" data-i18n="add">إضافة</button>
      <div class="loc-row">
        <label for="loc-input" class="visually-hidden" data-i18n="location">الموقع</label>
        <input class="field loc-field" id="loc-input" type="text" maxlength="200" placeholder="الموقع (اختياري)" data-i18n-ph="locPh" dir="auto">
        <button class="mic-btn locate-btn" id="locate-btn" type="button" aria-label="استخدم موقعي الحالي" data-i18n-aria="useLoc">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        </button>
      </div>
    </form>

    <div class="empty" id="empty" hidden>
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9.5"/>
        <polyline points="8 12.5 11 15.5 16.5 9.5"/>
      </svg>
      <p class="empty-title" data-i18n="emptyTitle">لا شيء لإنجازه بعد</p>
      <p class="empty-text" data-i18n="emptyText">أضف أول مهمة في الأعلى للبدء.</p>
    </div>

    <ul class="list" id="list" aria-label="المهام" data-i18n-aria="title"></ul>
    <p class="filter-empty" id="filter-empty" hidden></p>

    <div class="filter-bar" id="filter-bar" hidden>
      <div class="filters" role="group" aria-label="تصفية المهام" data-i18n-aria="filterGroup">
        <button type="button" class="filter-btn" data-filter="all" aria-pressed="true" data-i18n="all">الكل</button>
        <button type="button" class="filter-btn" data-filter="active" aria-pressed="false" data-i18n="active">النشطة</button>
        <button type="button" class="filter-btn" data-filter="done" aria-pressed="false" data-i18n="done">المنجزة</button>
      </div>
      <button type="button" class="clear-btn" id="clear-btn" data-i18n="clear">حذف المنجزة</button>
    </div>
  </section>

  <footer class="app-footer">
    <p class="counter" id="counter" aria-live="polite">المتبقي: 0</p>
    <p class="hint" id="hint" hidden></p>
  </footer>

  <div class="visually-hidden" id="announcer" aria-live="polite"></div>
</main>

    langBtn.lang = T('switchLang');
    langBtn.setAttribute('aria-label', T('switchLabel'));
    nodes.forEach(function (li, id) { var t = findTask(id); if (t) updateItem(li, t); });
    render();
  }
  langBtn.addEventListener('click', function () {
    lang = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* session only */ }
    applyLang();
  });
  applyLang();

  /* ---------- Location ---------- */
  locInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') locInput.value = '';
  });
  locateBtn.addEventListener('click', function () {
    if (!navigator.geolocation) { announce(T('locNA')); return; }
    locateBtn.classList.add('busy');
    navigator.geolocation.getCurrentPosition(function (pos) {
      locateBtn.classList.remove('busy');
      locInput.value = pos.coords.latitude.toFixed(5) + ', ' + pos.coords.longitude.toFixed(5);
      announce(T('locAdded'));
    }, function () {
      locateBtn.classList.remove('busy');
      announce(T('locFail'));
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  });

  /* ---------- Voice input ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var activeRec = null;
  var activeMicBtn = null;
  function setMicState(btn, on) {
    btn.classList.toggle('listening', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.setAttribute('aria-label', on ? T('stopDictate') : T(btn.dataset.label || 'dictate'));
  }
  function dictate(btn, input, onChange) {
    if (!SR) return;
    if (activeRec) {
      var same = activeMicBtn === btn;
      activeRec.stop();
      if (same) return;
    }
    var rec = new SR();
    rec.lang = T('speech');
    rec.interimResults = true;
    rec.continuous = false;
    var baseText = input.value.trim();
    rec.onresult = function (e) {
      var spoken = '';
      for (var i = 0; i < e.results.length; i++) spoken += e.results[i][0].transcript;
      input.value = ((baseText ? baseText + ' ' : '') + spoken.trim()).slice(0, 300);
      if (onChange) onChange();
    };
    rec.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') announce(T('micBlocked'));
    };
    rec.onend = function () {
      setMicState(btn, false);
      if (activeRec === rec) { activeRec = null; activeMicBtn = null; }
      if (document.contains(input)) input.focus();
    };
    try { rec.start(); activeRec = rec; activeMicBtn = btn; setMicState(btn, true); }
    catch (err) { setMicState(btn, false); }
  }
  (function setupMic() {
    var micBtn = document.getElementById('mic-btn');
    if (!micBtn || !SR) return;
    micBtn.hidden = false;
    micBtn.addEventListener('click', function () {
      dictate(micBtn, newInput, function () {
        newInput.value = newInput.value.slice(0, 200);
        updateAddBtn();
      });
    });
  })();
  newInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      newInput.value = '';
      updateAddBtn();
    }
  });

  list.addEventListener('change', function (e) {
    var cb = e.target;
    if (!cb.matches('.check input')) return;
    var li = cb.closest('.item');
    toggleTask(li.dataset.id, cb.checked);
  });

  list.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var li = btn.closest('.item');
    if (!li || li.classList.contains('leaving')) return;
    if (btn.classList.contains('note-edit')) { startNoteEdit(btn.closest('.note')); return; }
    if (btn.classList.contains('note-del')) { deleteNote(li.dataset.id, btn.closest('.note').dataset.noteId); return; }
    if (btn.classList.contains('note-mic')) {
      var fld = li.querySelector('.note-field');
      dictate(btn, fld);
      return;
    }
    if (btn.classList.contains('notes-btn')) { toggleNotes(li.dataset.id); return; }
    if (btn.classList.contains('del-btn')) deleteTask(li.dataset.id, true);
    else if (btn.classList.contains('edit-btn')) startEdit(li.dataset.id);
  });

  list.addEventListener('submit', function (e) {
    if (!e.target.matches('.note-form')) return;
    e.preventDefault();
    var li = e.target.closest('.item');
    if (li) addNote(li.dataset.id, e.target.querySelector('.note-field'));
  });

  list.addEventListener('mousedown', function (e) {
    var text = e.target.closest('.text');
    if (!text) return;
    if (e.detail > 1) {
      e.preventDefault();
      text.classList.add('noselect');
      var release = function () {
        setTimeout(function () { text.classList.remove('noselect'); }, 0);
        document.removeEventListener('mouseup', release);
      };
      document.addEventListener('mouseup', release);
    }
  });

  list.addEventListener('click', function (e) {
    var nt = e.target.closest('.note-text');
    if (nt) startNoteEdit(nt.closest('.note'));
  });

  list.addEventListener('dblclick', function (e) {
    var text = e.target.closest('.text');
    if (!text) return;
    var li = text.closest('.item');
    if (li && !li.classList.contains('leaving')) {
      var sel = window.getSelection && window.getSelection();
      if (sel && sel.removeAllRanges) sel.removeAllRanges();
      startEdit(li.dataset.id);
    }
  });

  list.addEventListener('keydown', function (e) {
    var el = e.target;
    var li = el.closest('.item');
    if (!li) return;
    var id = li.dataset.id;
    if (el.matches('.check input')) {
      if (e.key === 'Enter' || e.key === 'F2') {
        e.preventDefault();
        startEdit(id);
      } else if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault();
        deleteTask(id, true);
      }
    } else if (el.matches('.edit')) {
      if (e.key === 'Enter') {
        e.preventDefault();
        finishEdit(true, true);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        finishEdit(false, true);
      }
    }
  });

  list.addEventListener('focusout', function (e) {
    var el = e.target;
    if (!el.matches || !el.matches('.edit')) return;
    var li = el.closest('.item');
    if (li && editingId === li.dataset.id) finishEdit(true, false);
  });

  filterBtns.forEach(function (b) {
    b.addEventListener('click', function () { setFilter(b.dataset.filter); });
  });
  clearBtn.addEventListener('click', clearCompleted);

  function onTouchChange() { render(); }
  if (touchMQ) {
    if (touchMQ.addEventListener) touchMQ.addEventListener('change', onTouchChange);
    else if (touchMQ.addListener) touchMQ.addListener(onTouchChange);
  }

  /* ---------- Init ---------- */
  updateAddBtn();
  render();
  if (tasks.length === 0) {
    newInput.setAttribute('autofocus', '');
    newInput.focus();
  }

  /* ---------- Offline / install ---------- */
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* optional */ });
    });
  }
})();
</script>
</body>
</html>
