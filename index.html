<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المهام</title>
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="المهام">
<style>
  :root {
    color-scheme: light dark;
    --bg: #F6F7F9;
    --surface: #FFFFFF;
    --surface-hover: #F1F3F5;
    --border: #E3E6EA;
    --border-strong: #C4CAD1;
    --text: #1F2328;
    --text-muted: #5F6B76;
    --accent: #2563EB;
    --accent-hover: #1D4ED8;
    --on-accent: #FFFFFF;
    --accent-soft: #E8EFFD;
    --accent-text: #1D4ED8;
    --success: #16A34A;
    --on-success: #FFFFFF;
    --danger: #C62828;
    --danger-soft: #FDECEC;
    --focus-ring: #2563EB66;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --shadow-card: 0 1px 2px rgba(16,24,40,.06), 0 4px 12px rgba(16,24,40,.06);
    --ease: 150ms ease-out;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1115;
      --surface: #181B21;
      --surface-hover: #20242B;
      --border: #2A2F37;
      --border-strong: #3E4550;
      --text: #E6E8EB;
      --text-muted: #9BA3AE;
      --accent: #60A5FA;
      --accent-hover: #93C5FD;
      --on-accent: #0B1220;
      --accent-soft: #1B2A44;
      --accent-text: #93C5FD;
      --success: #22C55E;
      --on-success: #0B1220;
      --danger: #F87171;
      --danger-soft: #3A1D1F;
      --focus-ring: #60A5FA80;
      --shadow-card: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    overflow-x: hidden;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  button, input, .box, .box svg, .item, .text {
    transition: background-color var(--ease), color var(--ease), border-color var(--ease),
                opacity var(--ease), transform var(--ease);
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .visually-hidden {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0);
    white-space: nowrap; border: 0;
  }

  /* Layout */
  .page {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 16px 48px;
  }
  .app-header {
    padding: calc(24px + env(safe-area-inset-top)) 0 16px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .lang-btn {
    flex: none;
    height: 36px;
    min-width: 44px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .lang-btn:hover { border-color: var(--border-strong); }
  .lang-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }
  .subtitle {
    margin: 4px 0 0;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
  }

  /* Input row */
  .new-form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .field {
    flex: 1;
    min-width: 0;
    height: 44px;
    padding: 0 12px;
    font-size: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
  }
  .field::placeholder { color: var(--text-muted); opacity: 1; }
  .field:hover { border-color: var(--border-strong); }
  .field:focus, .field:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--focus-ring);
  }
  .add-btn {
    flex: none;
    height: 44px;
    padding: 0 16px;
    border: 0;
    border-radius: var(--radius-md);
    background: var(--accent);
    color: var(--on-accent);
    font-size: 15px;
    font-weight: 600;
  }
  .add-btn:not([aria-disabled="true"]):hover { background: var(--accent-hover); }
  .add-btn:not([aria-disabled="true"]):active { transform: scale(0.98); }
  .add-btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; }
  .mic-btn {
    flex: none;
    width: 44px;
    height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
  }
  .loc-row { display: flex; gap: 8px; flex: 1 1 100%; }
  .due-row { display: flex; align-items: center; gap: 8px; flex: 1 1 100%; }
  .due-wrap { position: relative; flex: 1; min-width: 0; display: flex; }
  .due-wrap .due-field { flex: 1; width: 100%; }
  .due-label {
    position: absolute; inset-inline-start: 13px; top: 0; bottom: 0;
    display: none; align-items: center; gap: 6px;
    font-size: 15px; color: var(--text-muted); pointer-events: none;
  }
  .due-wrap.is-empty .due-label { display: inline-flex; }
  .due-wrap.is-empty .due-field { color: transparent; }
  .due-wrap.is-empty .due-field::-webkit-datetime-edit { color: transparent; }
  .due-wrap.is-empty .due-field:focus::-webkit-datetime-edit { color: var(--text); }
  .due-field { flex: 1; min-width: 0; height: 40px; font-size: 15px; }
  .due-clear { height: 40px; width: 40px; }
  .due {
    display: flex; width: fit-content; align-items: center; gap: 4px;
    margin-top: 2px; padding: 0; border: 0; background: none;
    font-size: 13px; color: var(--text-muted); cursor: pointer; text-align: start;
  }
  .due span { white-space: nowrap; }
  .item > .icon-btn + .icon-btn { margin-inline-start: -8px; }
  .due svg { width: 13px; height: 13px; flex: none; }
  .due:hover { color: var(--accent); text-decoration: underline; }
  .due.overdue { color: var(--danger); }
  .item.done .due { color: var(--text-muted); }
  .loc-field { height: 40px; font-size: 15px; }
  .locate-btn { height: 40px; width: 40px; }
  .locate-btn.busy, .edit-locate.busy { opacity: .6; pointer-events: none; }
  .body { flex: 1; min-width: 0; }
  .loc {
    display: flex;
    width: fit-content;
    align-items: center;
    gap: 4px;
    margin-top: 2px;
    font-size: 13px;
    color: var(--accent-text);
    text-decoration: none;
    overflow-wrap: anywhere;
  }
  .loc[hidden], .mic-btn[hidden] { display: none; }
  .loc svg { width: 13px; height: 13px; flex: none; }
  .loc:hover { text-decoration: underline; }
  .mic-btn:hover { border-color: var(--border-strong); color: var(--text); }
  .mic-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mic-btn.listening {
    background: var(--danger);
    border-color: var(--danger);
    color: #FFFFFF;
    animation: mic-pulse 1.2s ease-in-out infinite;
  }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(198,40,40,.45); }
    50% { box-shadow: 0 0 0 6px rgba(198,40,40,0); }
  }
  @media (prefers-reduced-motion: reduce) { .mic-btn.listening { animation: none; } }

  /* Empty states */
  .empty {
    padding: 48px 16px;
    text-align: center;
  }
  .empty svg { display: block; margin: 0 auto; color: var(--text-muted); }
  .empty-title { margin: 12px 0 0; font-size: 16px; font-weight: 600; }
  .empty-text { margin: 4px 0 0; font-size: 14px; color: var(--text-muted); }
  .filter-empty {
    margin: 0;
    padding: 32px 16px;
    text-align: center;
    font-size: 14px;
    color: var(--text-muted);
  }

  /* List */
  .list { list-style: none; margin: 0; padding: 0; }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 52px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .item:last-child { border-bottom: 0; }
  .item { flex-wrap: wrap; }
  .icon-btn.notes-btn { width: auto; min-width: 32px; padding: 0 6px; gap: 3px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; }
  .notes-btn .count:empty { display: none; }
  .notes-btn[aria-expanded="true"], .notes-btn.has-notes { color: var(--accent-text); }
  .notes-btn:hover { color: var(--accent); background: var(--surface-hover); }
  .notes {
    flex: 0 0 auto;
    width: calc(100% - 34px);
    box-sizing: border-box;
    margin-inline-start: 34px;
    padding: 8px 12px 10px;
    border-inline-start: 2px solid var(--accent-soft);
  }
  .invite {
    flex: 0 0 auto;
    width: calc(100% - 34px);
    box-sizing: border-box;
    margin-inline-start: 34px;
    padding: 8px 12px 10px;
    border-inline-start: 2px solid var(--accent-soft);
  }
  .invitees { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; padding: 0; list-style: none; }
  .invitees:empty { display: none; }
  .invitee {
    display: inline-flex; align-items: center; gap: 2px;
    padding: 2px 4px 2px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent-text); font-size: 13px;
  }
  .invitee-del { width: 22px; height: 22px; }
  .invitee-del svg { width: 12px; height: 12px; }
  .invite-form { display: flex; gap: 6px; }
  .invite-form .field { flex: 1; min-width: 0; height: 38px; font-size: 15px; }
  .invite-send { height: 38px; padding: 0 12px; font-size: 14px; }
  .invite-btn.has-invitees, .invite-btn[aria-expanded="true"] { color: var(--accent-text); }
  .invite-btn:hover { color: var(--accent); background: var(--surface-hover); }
  .invite-err { margin: 6px 0 0; font-size: 13px; color: var(--danger); }
  .sheet-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(15, 17, 21, .45);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    width: 100%; max-width: 560px; box-sizing: border-box;
    background: var(--surface); color: var(--text);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 24px rgba(0,0,0,.15);
  }
  .sheet-title { margin: 0 0 12px; font-size: 15px; font-weight: 600; text-align: center; color: var(--text-muted); }
  .sheet-opt {
    display: block; width: 100%; min-height: 48px; margin: 0 0 8px; padding: 0 16px;
    border: 1px solid var(--border); border-radius: var(--radius-md);
    background: var(--surface); color: var(--text); font-size: 16px; font-weight: 500; text-align: center; cursor: pointer;
  }
  .sheet-opt:hover { background: var(--surface-hover); }
  .sheet-opt.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .sheet-cancel { color: var(--text-muted); border: 0; margin: 4px 0 0; }
  .note-list { list-style: none; margin: 0 0 8px; padding: 0; }
  .note-list:empty { display: none; }
  .note {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 4px 0;
    font-size: 14px;
    color: var(--text);
  }
  .note::before { content: "•"; color: var(--accent); font-weight: 700; flex: none; }
  .note-text { flex: 1; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .note-del, .note-edit { width: 24px; height: 24px; flex: none; }
  .note-del svg, .note-edit svg { width: 14px; height: 14px; }
  .note-edit:hover { color: var(--accent); background: var(--surface-hover); }
  .note-text { cursor: text; }
  .note-input { flex: 1; min-width: 0; height: 34px; font-size: 14px; padding: 0 8px; }
  .note-del:hover { color: var(--danger); background: var(--danger-soft); }
  .note-form { display: flex; gap: 6px; }
  .note-field { height: 38px; font-size: 15px; }
  .note-form .mic-btn { width: 38px; height: 38px; }
  .note-form .mic-btn svg { width: 18px; height: 18px; }
  .note-form .field { flex: 1; min-width: 0; }
  .note-add { height: 38px; padding: 0 12px; font-size: 14px; }
  .item:hover { background: var(--surface-hover); }
  .item.editing, .item.editing:hover { background: var(--surface); }
  .item.enter { animation: item-enter 150ms ease-out; }
  .item.leaving { animation: item-leave 120ms ease-out forwards; pointer-events: none; }
  @keyframes item-enter { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  @keyframes item-leave { to { opacity: 0; } }

  /* Checkbox */
  .check {
    position: relative;
    flex: none;
    width: 22px;
    height: 22px;
  }
  .check input {
    position: absolute;
    top: -11px; left: -11px;
    width: 44px; height: 44px;
    margin: 0;
    opacity: 0;
    cursor: pointer;
    z-index: 1;
  }
  .box {
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border: 2px solid var(--text-muted);
    border-radius: 50%;
    background: transparent;
  }
  .box svg {
    width: 12px; height: 12px;
    opacity: 0;
    transform: scale(0.6);
    color: var(--on-success);
  }
  .check:hover .box { border-color: var(--success); }
  .check input:checked + .box { background: var(--success); border-color: var(--success); }
  .check input:checked + .box svg { opacity: 1; transform: scale(1); }
  .check input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Text */
  .text {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    font-weight: 400;
    color: var(--text);
    overflow-wrap: anywhere;
  }
  .text.noselect { user-select: none; -webkit-user-select: none; }
  .item.done .text { color: var(--text-muted); text-decoration: line-through; }

  /* Icon buttons */
  .icon-btn {
    position: relative;
    flex: none;
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-muted);
  }
  .icon-btn::before { content: ""; position: absolute; inset: -6px; }
  .icon-btn svg { width: 18px; height: 18px; }
  .del-btn:hover { color: var(--danger); background: var(--danger-soft); }
  .edit-btn:hover { color: var(--accent); background: var(--surface-hover); }
  .edit-btn { display: none; }
  @media (hover: none) {
    .edit-btn { display: grid; }
  }
  @media (hover: hover) {
    .del-btn { opacity: 0; }
    .item:hover .del-btn, .item:focus-within .del-btn { opacity: 1; }
  }

  /* Edit mode */
  .edit { display: none; }
  .item.editing .check,
  .item.editing .body,
  .item.editing .notes,
  .item.editing .invite,
  .item.editing .icon-btn { display: none; }
  .item.editing .edit { display: block; margin-inline-start: 34px; }
  .edit-loc-row { display: none; gap: 8px; width: calc(100% - 34px); margin-inline-start: 34px; }
  .item.editing .edit-loc-row { display: flex; }
  .edit-due-row { display: none; gap: 8px; width: calc(100% - 34px); margin-inline-start: 34px; }
  .item.editing .edit-due-row { display: flex; }
  .edit-due-row .field { flex: 1; min-width: 0; height: 40px; font-size: 15px; }
  .edit-loc-row .field { flex: 1; min-width: 0; height: 40px; font-size: 15px; }
  .edit-loc-row .mic-btn { width: 40px; height: 40px; }
  .edit-loc-row .mic-btn svg { width: 18px; height: 18px; }

  /* Filter bar */
  .header-actions { display: flex; gap: 8px; flex: none; }
  .icon-head { display: inline-flex; align-items: center; justify-content: center; padding: 0 10px; }
  .icon-head[aria-expanded="true"], .icon-head.on { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent-soft); }
  .stats { margin-bottom: 16px; padding: 16px; }
  .stats-title { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { padding: 10px 8px; border: 1px solid var(--border); border-radius: var(--radius-md); text-align: center; }
  .stat-n { font-size: 24px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat-l { margin-top: 2px; font-size: 12px; color: var(--text-muted); }
  .stat.good .stat-n { color: var(--success); }
  .stat.bad .stat-n { color: var(--danger); }
  .stats-rate { margin: 14px 0 6px; font-size: 13px; color: var(--text-muted); }
  .stats-track { height: 8px; border-radius: 999px; background: var(--surface-hover); overflow: hidden; }
  .stats-fill { height: 100%; background: var(--success); border-radius: 999px; transition: width .3s; }
  .stats-sub { margin: 16px 0 6px; font-size: 13px; color: var(--text-muted); }
  .stats-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 96px; }
  .sd { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; height: 100%; }
  .sd-n { font-size: 11px; color: var(--text-muted); min-height: 14px; }
  .sd-bar { width: 70%; max-width: 28px; border-radius: 4px 4px 0 0; background: var(--accent); }
  .sd-bar.zero { background: var(--border); }
  .sd-l { font-size: 10px; color: var(--text-muted); white-space: nowrap; }
  body.locked .page { visibility: hidden; }
  .lock-screen {
    position: fixed; inset: 0; z-index: 100; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center;
  }
  .lock-screen[hidden] { display: none; }
  .lock-screen svg { color: var(--accent); }
  .lock-title { margin: 0; font-size: 22px; font-weight: 700; }
  .lock-msg { margin: 0; min-height: 20px; font-size: 14px; color: var(--danger); }
  .unlock-btn { height: 48px; padding: 0 28px; font-size: 16px; }
  .toolbar { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .search-wrap { position: relative; flex: 1; min-width: 0; display: flex; }
  .search-wrap svg { position: absolute; inset-inline-start: 11px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  .search-field { flex: 1; width: 100%; height: 38px; font-size: 15px; padding-inline-start: 34px; }
  .search-field::-webkit-search-cancel-button { cursor: pointer; }
  .view-btn { width: 38px; height: 38px; }
  .view-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent-soft); }
  .cal { padding: 12px 12px 4px; }
  .cal[hidden] { display: none; }
  .cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .cal-title { flex: 1; margin: 0; text-align: center; font-size: 16px; font-weight: 600; }
  .cal-nav { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); color: var(--text); cursor: pointer; font-size: 16px; }
  .cal-nav:hover { background: var(--surface-hover); }
  [dir="rtl"] .cal-nav { transform: scaleX(-1); }
  .cal-today { height: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); color: var(--text-muted); font-size: 13px; cursor: pointer; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-wd { text-align: center; font-size: 11px; color: var(--text-muted); padding: 4px 0; }
  .cal-day {
    position: relative; aspect-ratio: 1 / 1; min-height: 38px; border: 0; border-radius: var(--radius-sm);
    background: transparent; color: var(--text); font-size: 14px; cursor: pointer; font-variant-numeric: tabular-nums;
  }
  .cal-day:hover { background: var(--surface-hover); }
  .cal-day.other { color: var(--text-muted); opacity: .45; }

  function db() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve) {
      if (!window.indexedDB) { resolve(null); return; }
      var req;
      try { req = indexedDB.open('todo-app-files', 1); } catch (e) { resolve(null); return; }
      req.onupgradeneeded = function () { req.result.createObjectStore('files'); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { resolve(null); };
    });
    return dbPromise;
  }
  function idbGet(id) {
    return db().then(function (d) {
      if (!d) return null;
      return new Promise(function (resolve) {
        try {
          var r = d.transaction('files', 'readonly').objectStore('files').get(id);
          r.onsuccess = function () { resolve(r.result || null); };
          r.onerror = function () { resolve(null); };
        } catch (e) { resolve(null); }
      });
    });
  }
  function idbWrite(fn) {
    return db().then(function (d) {
      if (!d) return false;
      return new Promise(function (resolve) {
        try {
          var tx = d.transaction('files', 'readwrite');
          fn(tx.objectStore('files'));
          tx.oncomplete = function () { resolve(true); };
          tx.onerror = tx.onabort = function () { resolve(false); };
        } catch (e) { resolve(false); }
      });
    });
  }
  function getFileUrl(id) {
    if (urlCache[id]) return Promise.resolve(urlCache[id]);
    return idbGet(id).then(function (blob) {
      if (!blob) return null;
      urlCache[id] = URL.createObjectURL(blob);
      return urlCache[id];
    });
  }
  function removeFile(id) {
    if (urlCache[id]) { URL.revokeObjectURL(urlCache[id]); delete urlCache[id]; }
    idbWrite(function (st) { st.delete(id); });
  }

      var id = newId();
      var blob = new Blob([f], { type: f.type || 'application/octet-stream' });
      idbWrite(function (st) { st.put(blob, id); }).then(function (ok) {
        if (!ok) { announce(T('attFail')); window.alert(T('attFail')); return; }
        var tt = findTask(taskId);
        if (!tt) { removeFile(id); return; }
        if (!tt.attachments) tt.attachments = [];

        if (t.due && new Date(t.due).getTime() < now.getTime()) overdue++;

      [doneMonth, T('stDoneMonth'), 'good'],
      [overdue, T('stOverdue'), overdue ? 'bad' : ''],

    };
    rec.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') announce(T('micBlocked'));
    };
    rec.onend = function () {
      setMicState(btn, false);
      if (activeRec === rec) { activeRec = null; activeMicBtn = null; }
      if (document.contains(input)) input.focus();
    };
    try { rec.start(); activeRec = rec; activeMicBtn = btn; setMicState(btn, true); }
    catch (err) { setMicState(btn, false); }
  }
  (function setupMic() {
    var micBtn = document.getElementById('mic-btn');
    if (!micBtn || !SR) return;
    micBtn.hidden = false;
    micBtn.addEventListener('click', function () {
      dictate(micBtn, newInput, function () {
        newInput.value = newInput.value.slice(0, 200);
        updateAddBtn();
      });
    });
  })();
  newInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      newInput.value = '';
      updateAddBtn();
    }
  });

  list.addEventListener('change', function (e) {
    if (e.target.matches('.att-input')) {
      var al = e.target.closest('.item');
      if (al) addAttachments(al.dataset.id, e.target.files);
      e.target.value = '';
      return;
    }
    var cb = e.target;
    if (!cb.matches('.check input')) return;
    var li = cb.closest('.item');
    toggleTask(li.dataset.id, cb.checked);
  });

  list.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var li = btn.closest('.item');
    if (!li || li.classList.contains('leaving')) return;
    if (btn.classList.contains('note-edit')) { startNoteEdit(btn.closest('.note')); return; }
    if (btn.classList.contains('note-del')) { deleteNote(li.dataset.id, btn.closest('.note').dataset.noteId); return; }
    if (btn.classList.contains('note-mic')) {
      var fld = li.querySelector('.note-field');
      dictate(btn, fld);
      return;
    }
    if (btn.classList.contains('due')) { calendarMenu(li.dataset.id); return; }
    if (btn.classList.contains('notes-btn')) { toggleNotes(li.dataset.id); return; }
    if (btn.classList.contains('att-btn')) { li.querySelector('.att-input').click(); return; }
    if (btn.classList.contains('att-open')) { openAttachment(li.dataset.id, btn.closest('.att').dataset.attId); return; }
    if (btn.classList.contains('att-del')) { deleteAttachment(li.dataset.id, btn.closest('.att').dataset.attId); return; }
    if (btn.classList.contains('wa-btn')) { shareWhatsApp(li.dataset.id); return; }
    if (btn.classList.contains('invite-btn')) { toggleInvite(li.dataset.id); return; }
    if (btn.classList.contains('invitee-del')) { removeInvitee(li.dataset.id, btn.closest('.invitee').dataset.email); return; }
    if (btn.classList.contains('del-btn')) deleteTask(li.dataset.id, true);
    else if (btn.classList.contains('edit-btn')) startEdit(li.dataset.id);
  });

  list.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.edit-locate')) e.preventDefault();
  });
  list.addEventListener('mousedown', function (e) {
    if (e.target.closest('.edit-locate')) e.preventDefault();
  });
  list.addEventListener('click', function (e) {
    var btn = e.target.closest('.edit-locate');
    if (!btn) return;
    var li = btn.closest('.item');
    var field = li.querySelector('.edit-loc');
    if (!navigator.geolocation) { announce(T('locNA')); return; }
    btn.classList.add('busy');
    navigator.geolocation.getCurrentPosition(function (pos) {
      btn.classList.remove('busy');
      field.value = pos.coords.latitude.toFixed(5) + ', ' + pos.coords.longitude.toFixed(5);
      if (editingId === li.dataset.id) field.focus();
      else {
        var t = findTask(li.dataset.id);
        if (t) { t.location = field.value; saveTasks(); render(); }
      }
      announce(T('locAdded'));
    }, function () {
      btn.classList.remove('busy');
      announce(T('locFail'));
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  });

  list.addEventListener('submit', function (e) {
    if (e.target.matches('.invite-form')) {
      e.preventDefault();
      var il = e.target.closest('.item');
      if (il) sendInvite(il.dataset.id, e.target.querySelector('.invite-field'));
      return;
    }
    if (!e.target.matches('.note-form')) return;
    e.preventDefault();
    var li = e.target.closest('.item');
    if (li) addNote(li.dataset.id, e.target.querySelector('.note-field'));
  });

  list.addEventListener('mousedown', function (e) {
    var text = e.target.closest('.text');
    if (!text) return;
    if (e.detail > 1) {
      e.preventDefault();
      text.classList.add('noselect');
      var release = function () {
        setTimeout(function () { text.classList.remove('noselect'); }, 0);
        document.removeEventListener('mouseup', release);
      };
      document.addEventListener('mouseup', release);
    }
  });

  list.addEventListener('click', function (e) {
    var nt = e.target.closest('.note-text');
    if (nt) startNoteEdit(nt.closest('.note'));
  });

  list.addEventListener('dblclick', function (e) {
    var text = e.target.closest('.text');
    if (!text) return;
    var li = text.closest('.item');
    if (li && !li.classList.contains('leaving')) {
      var sel = window.getSelection && window.getSelection();
      if (sel && sel.removeAllRanges) sel.removeAllRanges();
      startEdit(li.dataset.id);
    }
  });

  list.addEventListener('keydown', function (e) {
    var el = e.target;
    var li = el.closest('.item');
    if (!li) return;
    var id = li.dataset.id;
    if (el.matches('.check input')) {
      if (e.key === 'Enter' || e.key === 'F2') {
        e.preventDefault();
        startEdit(id);
      } else if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault();
        deleteTask(id, true);
      }
    } else if (el.matches('.edit, .edit-loc, .edit-due')) {
      if (e.key === 'Enter') {
        e.preventDefault();
        finishEdit(true, true);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        finishEdit(false, true);
      }
    }
  });

  list.addEventListener('focusout', function (e) {
    var el = e.target;
    if (!el.matches || !el.matches('.edit, .edit-loc, .edit-locate, .edit-due')) return;
    var li = el.closest('.item');
    var to = e.relatedTarget;
    if (to && li && li.contains(to) && to.matches && to.matches('.edit, .edit-loc, .edit-locate, .edit-due')) return;
    if (li && editingId === li.dataset.id) finishEdit(true, false);
  });

  filterBtns.forEach(function (b) {
    b.addEventListener('click', function () { setFilter(b.dataset.filter); });
  });
  clearBtn.addEventListener('click', clearCompleted);

  function onTouchChange() { render(); }
  if (touchMQ) {
    if (touchMQ.addEventListener) touchMQ.addEventListener('change', onTouchChange);
    else if (touchMQ.addListener) touchMQ.addListener(onTouchChange);
  }

  /* ---------- Init ---------- */
  updateAddBtn();
  render();
  if (tasks.length === 0) {
    newInput.setAttribute('autofocus', '');
    newInput.focus();
  }

  /* ---------- Offline / install ---------- */
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* optional */ });
    });
  }
})();
</script>
</body>
</html>
