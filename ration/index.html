<style>
@font-face{font-family:Tajawal;font-weight:400;font-display:swap;src:url(fonts/tajawal-arabic-400-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+0660-0669}
@font-face{font-family:Tajawal;font-weight:400;font-display:swap;src:url(fonts/tajawal-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:Tajawal;font-weight:500;font-display:swap;src:url(fonts/tajawal-arabic-500-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+0660-0669}
@font-face{font-family:Tajawal;font-weight:500;font-display:swap;src:url(fonts/tajawal-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:Tajawal;font-weight:700;font-display:swap;src:url(fonts/tajawal-arabic-700-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+0660-0669}

@font-face{font-family:Tajawal;font-weight:800;font-display:swap;src:url(fonts/tajawal-arabic-800-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+0660-0669}
@font-face{font-family:Tajawal;font-weight:800;font-display:swap;src:url(fonts/tajawal-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
/* VOICE: friendly and cheerful, like a neighbour who knows every offer in town.
   IDEA: your basket as a set of colourful tiles; the cheapest basket is the dark card that pops.
   COLOUR and TYPE: warm cream ground, coral brand, sunny yellow for prices, pastel tiles; Tajawal.
   LAYOUT: one phone-width column, greeting on top, 2-column tiles, rounded white tab bar. */
:root{color-scheme:light dark;
--bg:light-dark(#FFF8EE,#16131D);--card:light-dark(#FFFFFF,#221E2C);--ink:light-dark(#26213A,#F4F0FA);
--muted:light-dark(#7A7590,#A49FB5);--line:light-dark(#F0E7DA,#322D3E);--fill:light-dark(#F6EEE2,#2C2738);
--coral:#FF6B4A;--sun:#FFD43B;--dark:light-dark(#26213A,#2E2840);--good:light-dark(#178A54,#4FD08B);
--accent:var(--coral);--accentSoft:light-dark(#FFE6DF,#3A2A2A);--onAccent:#FFFFFF;--rec:#FF3B30;
--t1:light-dark(#DDEBFF,#22324A);--t2:light-dark(#FFE9B8,#45391C);--t3:light-dark(#FFD9CF,#4A2C26);
--t4:light-dark(#DDF5E3,#1F3B2A);--t5:light-dark(#EBE0FF,#33294A);--t6:light-dark(#FFE0F0,#45263A)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Tajawal,-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:calc(16px + env(safe-area-inset-top)) 20px 0}
.hrow{display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:32px;line-height:1.2;font-weight:800}
header h1 .pill{display:inline-block;background:var(--coral);color:#fff;border-radius:12px;padding:0 10px;margin-inline-start:3px;transform:rotate(-4deg)}
.lang{margin-inline-start:auto;min-height:40px;border:0;background:var(--sun);color:#26213A;border-radius:20px;padding:0 16px;font-size:14px;font-weight:800;cursor:pointer}
.hi{margin:14px 0 0;font-size:24px;font-weight:800}
header p{margin:2px 0 0;font-size:15px;color:var(--muted)}
body:not([data-v=list]) .hi, body:not([data-v=list]) header p{display:none}
main{flex:1;padding:14px 16px 110px}
.view{display:none}.view.on{display:block}
h2{font-size:20px;margin:20px 4px 10px;font-weight:800}
.card{background:var(--card);border-radius:22px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 0 var(--line)}
.muted{color:var(--muted);font-size:14px}
.note{background:var(--t2);border-radius:18px;padding:12px 14px;font-size:14px;margin-bottom:12px}
textarea,input,select{width:100%;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:13px 14px;font-size:16px;outline:none}
textarea:focus,input:focus{border-color:var(--coral)}
textarea{min-height:56px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted)}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
label.muted{display:block;margin:0 4px 6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{min-height:46px;border:0;border-radius:16px;padding:0 16px;font-weight:700;cursor:pointer;background:var(--card);color:var(--ink);font-size:15px;box-shadow:0 2px 0 var(--line)}

.btn.main{background:var(--dark);color:var(--sun);width:100%;font-size:18px;font-weight:800;min-height:58px;border-radius:22px;margin-top:16px;box-shadow:none}
.btn[disabled]{opacity:.5;cursor:default}
.grow{flex:1}
#items{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#items .empty{grid-column:1/-1}
.tile{border-radius:22px;padding:12px;min-height:128px;position:relative;display:flex;flex-direction:column;color:var(--ink)}
.tile .emo{font-size:34px;line-height:1.1}
.tile .name{font-weight:800;font-size:16px;line-height:1.3;margin:6px 0 8px;flex:1;overflow-wrap:anywhere}
.tile .x{position:absolute;top:8px;inset-inline-end:8px;background:rgba(255,255,255,.7);color:var(--ink)}
.item{display:flex;align-items:center;gap:12px}
.item .name{flex:1;font-weight:500}
.qty{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.75);border-radius:999px;padding:2px;align-self:flex-start}
:root[data-theme=dark] .qty,.qty{background:light-dark(rgba(255,255,255,.75),rgba(0,0,0,.25))}
.qty b{min-width:22px;text-align:center;font-weight:800}
.qty button{width:32px;height:32px;border-radius:50%;border:0;background:transparent;cursor:pointer;font-size:18px;font-weight:700;color:var(--ink)}
.x{width:30px;height:30px;border-radius:15px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
.tag{display:inline-flex;align-items:center;background:var(--sun);color:#26213A;font-weight:800;white-space:nowrap;font-size:16px;border-radius:999px;padding:3px 12px}
.old{text-decoration:line-through;color:var(--muted);font-size:13px;white-space:nowrap}
.big{font-size:clamp(34px,10vw,44px);font-weight:800;line-height:1.1;color:var(--sun);margin:6px 0}
.hero{background:var(--dark);color:#fff;border-radius:26px;padding:18px;margin-bottom:12px}
.hero .muted{color:rgba(255,255,255,.7)}
.hero .save{color:var(--sun)}
.tabs{display:flex;margin-bottom:14px;background:var(--fill);border-radius:18px;padding:4px}
.tabs button{flex:1;min-height:40px;border-radius:14px;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:15px;cursor:pointer}
.tabs button.on{background:var(--coral);color:#fff}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:2px dashed var(--line)}
.line:first-of-type{border-top:0}
.save{color:var(--good);font-weight:700}
nav{position:fixed;bottom:0;inset-inline:0;background:#26213A;border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgba(38,33,58,.18);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:560px;width:100%;padding:6px 8px}
nav button{flex:1;min-height:58px;border:0;background:transparent;cursor:pointer;color:rgba(255,255,255,.55);font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:18px}
nav button i{font-style:normal;font-size:24px;line-height:1;filter:saturate(.6);opacity:.7;transition:transform .15s}
nav button.on{color:var(--sun)}
nav button.on i{filter:none;opacity:1;transform:translateY(-2px) scale(1.12)}
.bubble{max-width:86%;padding:11px 15px;border-radius:22px;margin-bottom:8px;white-space:pre-wrap;line-height:1.5}
.bubble.me{background:var(--coral);color:#fff;margin-inline-start:auto;border-end-start-radius:6px}
.bubble.ai{background:var(--card);border-end-end-radius:6px;box-shadow:0 2px 0 var(--line)}
.spin{display:inline-block;width:16px;height:16px;border:3px solid var(--line);border-top-color:var(--coral);border-radius:50%;animation:s 1s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}nav button i{transition:none}}
.store{font-weight:800;margin:18px 4px 8px;font-size:16px}
.empty{text-align:center;padding:30px 12px;color:var(--muted);background:var(--card);border:2.5px dashed var(--line);border-radius:22px}
.thumb{width:54px;height:54px;flex:none;border-radius:16px;overflow:hidden;position:relative;background:#fff}
.thumb img{position:absolute;max-width:none;left:0;top:0;opacity:0;transition:opacity .2s}
.thumb img.ok{opacity:1}
.rowi{display:flex;gap:12px;align-items:center}
.say{display:inline-flex;align-items:center;justify-content:center;min-width:40px;min-height:32px;margin-top:6px;border:0;border-radius:16px;background:var(--fill);cursor:pointer;font-size:15px}
.say.on{background:var(--accentSoft)}
.vlang{padding:0 10px;min-width:46px;font-weight:800}
.mic{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.mic.on{background:var(--rec);color:#fff;transform:scale(1.06)}
#chatSend{background:var(--coral);color:#fff;box-shadow:none}
.modes{display:flex;gap:8px;margin-top:14px;background:var(--fill);border-radius:22px;padding:5px}
.modes button{flex:1;min-height:48px;border:0;border-radius:18px;background:transparent;color:var(--muted);font-weight:800;font-size:17px;cursor:pointer}
.modes button.on{background:var(--dark);color:var(--sun)}
body[data-mode=food] main .view{display:none}
body[data-mode=food] main #v-food{display:block}
body[data-mode=food] nav{display:none}
body[data-mode=food] main{padding-bottom:40px}
.app-chip{display:inline-flex;align-items:center;justify-content:center;min-width:86px;border-radius:12px;padding:4px 10px;font-weight:800;font-size:14px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;min-height:42px;border:0;border-radius:999px;padding:0 16px;font-weight:800;font-size:15px;background:var(--card);box-shadow:0 2px 0 var(--line);cursor:pointer;white-space:nowrap}
.strip button.on{background:var(--coral);color:#fff}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 8px}
.cat{border:0;border-radius:20px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--ink);font-weight:700;font-size:12px;line-height:1.2;text-align:center;min-height:92px}
.cat i{font-style:normal;font-size:30px;line-height:1}
.cat.on{outline:3px solid var(--coral);outline-offset:-3px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:18px 4px 8px}
.sechead b{font-size:18px;font-weight:800}
.sechead button{border:0;background:none;color:var(--coral);font-weight:800;font-size:14px;cursor:pointer}
.prow{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.prow::-webkit-scrollbar{display:none}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--card);border-radius:20px;padding:10px;box-shadow:0 2px 0 var(--line);display:flex;flex-direction:column;gap:6px;position:relative}
.prow .pcard{flex:none;width:156px}
.pcard .pimg{height:112px;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden;font-size:44px}
.pcard .pimg .thumb{width:100%;height:112px;border-radius:14px}
.pcard .pn{font-size:14px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.pcard .ps{font-size:12px;color:var(--muted)}
.pcard .pp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pcard .tag{font-size:14px;padding:2px 10px}
.pcard .off{position:absolute;top:14px;inset-inline-start:14px;background:var(--coral);color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:800;z-index:1}
.pcard .x{position:absolute;top:14px;inset-inline-end:14px;background:rgba(255,255,255,.85);z-index:1}
.cat small{font-size:11px;color:var(--muted);font-weight:700}
.prw{display:flex;align-items:center;gap:12px;position:relative;padding:10px 12px}
.prw .pimg{width:72px;height:72px;flex:none;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden;font-size:36px}
.prw .pimg .thumb{width:72px;height:72px}
.prw .pinfo{flex:1;min-width:0}
.prw .pn{font-size:15px;font-weight:700;line-height:1.3}
.prw .ps{font-size:13px;color:var(--muted);margin:2px 0 4px}
.prw .pp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prw .pct{color:var(--coral);font-weight:800;font-size:13px}
.best{background:var(--good);color:#fff;border-radius:999px;padding:0 8px;font-size:12px;font-weight:800}
.addp{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:var(--coral);color:#fff;font-size:24px;font-weight:800;cursor:pointer}
.addp.done{background:var(--good)}
.prw .x{position:absolute;top:6px;inset-inline-start:6px;background:var(--card)}
.composer{display:flex;align-items:flex-end;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:6px 6px 6px 6px}
.composer:focus-within{border-color:var(--coral)}
.composer textarea{border:0;background:transparent;min-height:44px;max-height:160px;padding:10px 10px;resize:none;flex:1;border-radius:18px}
.addround{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--coral);color:#fff;font-size:26px;font-weight:800;cursor:pointer}
.quick-h{margin:14px 4px 6px;font-weight:700}
.sumcard{background:var(--dark);color:#fff;border-radius:26px;padding:16px 18px;margin-bottom:12px}
.sumcard .l{font-size:14px;opacity:.75}
.sumcard .v{font-size:34px;font-weight:800;color:var(--sun);line-height:1.15;margin:2px 0}
.sumcard .r{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sumcard .r span{background:rgba(255,255,255,.12);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.tile .deal{font-size:13px;font-weight:800;margin:-4px 0 8px;line-height:1.3}
.tile .deal b{background:var(--sun);color:#26213A;border-radius:999px;padding:1px 8px;white-space:nowrap}
.tile .deal small{display:block;font-weight:600;opacity:.7;margin-top:2px}
.tile .nodeal{font-size:12px;opacity:.6;margin:-4px 0 8px}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dcat{background:#fff;border:1.5px solid #ECE6DC;border-radius:12px;padding:10px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;color:#26213A;font-size:14px;font-weight:500;line-height:1.25;text-align:center;min-height:150px}
.dcat .im{width:100%;height:86px;display:grid;place-items:center;font-size:52px;overflow:hidden}
.dcat .im img{max-width:100%;max-height:86px;object-fit:contain}
.dcat .im .thumb{width:86px;height:86px;border-radius:8px}
.dcat small{color:#8A8597;font-size:11px}
.h2b{font-size:22px;font-weight:800;margin:18px 2px 12px;display:flex;justify-content:space-between;align-items:center}
.h2b button{border:0;background:none;color:var(--coral);font-size:24px;cursor:pointer}
.drow{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 6px;scrollbar-width:none}
.drow::-webkit-scrollbar{display:none}
.dprod{background:#fff;border:1.5px solid #ECE6DC;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px;position:relative;color:#26213A}
.drow .dprod{flex:none;width:150px}
.dprods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dprod .im{height:120px;display:grid;place-items:center;overflow:hidden;font-size:54px;border-radius:8px}
.dprod .im img.p{max-width:100%;max-height:120px;object-fit:contain}
.dprod .im .thumb{width:110px;height:110px}
.dprod .pn{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.dprod .pr{font-weight:800;font-size:16px}
.dprod .pr .old{font-weight:500;margin-inline-start:6px}
.dprod .st{font-size:12px;color:#8A8597}
.dprod .addp{position:absolute;top:92px;inset-inline-end:8px;width:36px;height:36px;font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.dprod .off{position:absolute;top:8px;inset-inline-start:8px;background:var(--coral);color:#fff;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:800}
.dprod .best{position:absolute;top:8px;inset-inline-end:8px}
.dprod .x{position:absolute;top:36px;inset-inline-start:8px;background:#fff}
.dish h3{margin:0;font-size:19px;font-weight:800}
.dish .emo{font-size:40px;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;flex:none}
.cheap{background:var(--dark);color:#fff;border-radius:18px;padding:12px 14px;margin:12px 0 4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cheap b{color:var(--sun);font-size:20px}
.frow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:2px dashed var(--line)}
.frow .d{flex:1;font-size:13px;color:var(--muted)}
.frow .tot{font-weight:800;white-space:nowrap}
.frow.best .tot{color:var(--good)}
</style>

<body data-v="list">
<div class="app">
<header>
  <div class="hrow"><h1 id="brand"></h1><button class="lang" id="langBtn"></button></div>
  <div class="modes" role="tablist"><button data-m="grocery" class="on" data-i="modeGrocery"></button><button data-m="food" data-i="modeFood"></button></div>
  <div class="hi" data-i="hello"></div>
  <p id="sub"></p>
</header>

<main>
  <section class="view" id="v-food">
    <div class="note" data-i="foodDemo"></div>
    <input id="foodQ" data-ph="foodPh" autocomplete="off">
    <div class="row" id="foodChips" style="margin:10px 0 6px"></div>
    <h2 data-i="restaurants"></h2>
    <div id="restStrip" class="strip"></div>
    <div id="foodRes"></div>
  </section>
  <section class="view on" id="v-list">
    <div id="demoNote" class="note" hidden data-i="demoNote"></div>
    <div id="sumCard" class="sumcard" hidden></div>
    <div class="composer">
      <textarea id="draft" rows="1" data-ph="draftPh" aria-label="add"></textarea>
      <button class="addround" id="addBtn" aria-label="add">＋</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn mic grow" id="micBtn" hidden></button>
      <button class="btn vlang" hidden aria-label="voice language"></button>
      <label class="btn grow" id="photoLbl" style="display:inline-flex;align-items:center;justify-content:center" hidden><span data-i="photo"></span><input type="file" id="listPhoto" accept="image/*" hidden></label>
    </div>
    <div id="listBusy" class="muted" style="margin-top:8px"></div>
    <div class="quick-h muted" data-i="quickAdd"></div>
    <div id="quick" class="strip"></div>
    <h2 style="margin-top:12px"><span data-i="myList"></span> <span class="muted" id="count"></span></h2>
    <div id="items"></div>

  const img = await createImageBitmap(file);
  const k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return { media_type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] };
}

function norm(s){
  return String(s || '').toLowerCase()
    .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x660)
    .replace(/[ً-ْ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
    .replace(/(\d)\s*(لتر|ltr|litre|liter|l)\b/g, '$1l').replace(/(\d)\s*(كيلو|كغ|كجم|kg)/g, '$1kg')
    .replace(/(\d)\s*(مل|ml)\b/g, '$1ml').replace(/(\d)\s*(جرام|غرام|غ|gm|g)\b/g, '$1g');
}

function localScore(q, o){
  const a = toks(q), b = new Set(toks(offerText(o)));
  if (!a.length) return 0;

}

    if (!it.offers.length) return { item: it.text, qty: it.quantity, found: false };
    const o = it.offers.reduce((a, b) => b.price < a.price ? b : a);
    return { item: it.text, qty: it.quantity, found: true, store: o.store, price: o.price, old: o.oldPrice, total: o.price * it.quantity, until: o.until, name: offerText(o), image: o.image, box: o.box };
  });
  return { single, best, perItem, count: basket.length };
}

// cheapest current offer for a list item (local match: same product type + shared words)
function bestFor(text){
  if (!offers.length) return null;
  const words = norm(text.replace(/·.*$/, '')).split(/[\s,،.\-]+/).filter(w => w.length > 1 && !/^\d/.test(w));
  const ty = typeOf({name: text})[0];
  let best = null, bs = -1;
  for (const o of offers){
    const ot = norm(offerText(o));
    const hit = words.filter(w => ot.includes(w)).length;
    const same = ty !== 'other' && typeOf(o)[0] === ty;
    if (!hit && !same) continue;
    const score = hit * 2 + (same ? 3 : 0);
    if (score > bs || (score === bs && o.price < best.price)){ best = o; bs = score; }
  }
  return bs >= 3 ? best : null;
}

const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let speakingIdx = -1;
// best installed voice for a language: enhanced/premium first, then any voice of that language
let voiceList = [];
const loadVoices = () => { if (canSpeak) voiceList = speechSynthesis.getVoices(); };
if (canSpeak){ loadVoices(); speechSynthesis.addEventListener && speechSynthesis.addEventListener('voiceschanged', loadVoices); }
function pickVoice(code){
  const all = voiceList.length ? voiceList : (canSpeak ? speechSynthesis.getVoices() : []);
  const mine = all.filter(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith(code));
  const score = v => (/premium|enhanced|natural|neural|siri/i.test(v.name) ? 4 : 0) + (v.localService ? 1 : 0) + (/^(ar-ae|ar-sa|ar-001|en-us|en-gb)$/i.test(v.lang.replace('_', '-')) ? 2 : 0);
  return mine.sort((a, b) => score(b) - score(a))[0] || null;
}
// make a reply easy to read aloud: no symbols, currency in words, one language at a time
function speechText(text, ar){
  let s = text.replace(/[*_#`>|•]/g, ' ').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, ' ');
  s = ar ? s.replace(/د\.إ|AED|Dhs?\.?/gi, ' درهم ').replace(/(\d)\s*[x×]\s*(\d)/g, '$1 في $2').replace(/\//g, ' ')
         : s.replace(/AED\s*([\d.]+)/gi, '$1 dirhams').replace(/د\.إ/g, ' dirhams').replace(/(\d)\s*[x×]\s*(\d)/g, '$1 by $2');
  return s.replace(/\s+/g, ' ').trim();
}
function speak(text, idx = -1){
  if (!canSpeak || !text) return;
  speechSynthesis.cancel();
  const arabic = (text.match(/[؀-ۿ]/g) || []).length, latin = (text.match(/[A-Za-z]/g) || []).length;
  const ar = arabic >= latin;
  const voice = pickVoice(ar ? 'ar' : 'en');
  if (ar && !voice){ $('chatHint').textContent = t('noArabicVoice'); return; }
  const u = new SpeechSynthesisUtterance(speechText(text, ar));
  if (voice){ u.voice = voice; u.lang = voice.lang; } else u.lang = ar ? 'ar-SA' : 'en-US';
  u.rate = ar ? 0.9 : 1;
  speakingIdx = idx;
  u.onend = u.onerror = () => { speakingIdx = -1; renderChat(); };
  speechSynthesis.speak(u);
  renderChat();
}

/* ---------- voice input with the browser's own speech recognition (Chrome, Edge, Safari) ---------- */
let voiceLang = null; // language you speak into the mic; starts as the app language
function browserVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  try { voiceLang = localStorage.getItem('ration-voice'); } catch {}
  if (voiceLang !== 'ar' && voiceLang !== 'en') voiceLang = lang;
  const chips = document.querySelectorAll('.vlang');
  const showChips = () => chips.forEach(c => { c.hidden = false; c.textContent = voiceLang === 'ar' ? 'ع' : 'EN'; });
  showChips();
  chips.forEach(c => c.onclick = () => { voiceLang = voiceLang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('ration-voice', voiceLang); } catch {} showChips(); });
  // one recogniser at a time; each button says where the words go and what happens at the end
  let rec = null, active = null;
  const stop = () => { try { rec && rec.stop(); } catch {} };
  // WhatsApp-style: hold to talk, release to send, slide off the button to cancel
  const setup = (btn, opts) => {
    btn.hidden = false;
    const idle = () => { btn.classList.remove('on'); btn.textContent = btn.id === 'micBtn' ? t('mic') : t('micShort'); };
    const note = text => { const el = $(opts.msg); if (el) el.textContent = text; };
    idle();
    let field, before = '', finalText = '', cancelled = false, holding = false, pressedAt = 0, x0 = 0, y0 = 0;
    btn.addEventListener('contextmenu', e => e.preventDefault());
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { btn.setPointerCapture(e.pointerId); } catch {}
      x0 = e.clientX; y0 = e.clientY;
      unlockSpeech();
      stop();
      holding = true; cancelled = false; pressedAt = Date.now(); finalText = '';
      field = $(opts.field); before = field.value;
      rec = new SR();
      rec.lang = voiceLang === 'ar' ? 'ar-AE' : 'en-US';
      rec.interimResults = true; rec.continuous = true;
      rec.onresult = ev => {
        if (cancelled) return;
        let interim = '';
        for (let i = ev.resultIndex; i < ev.results.length; i++){
          if (ev.results[i].isFinal) finalText += (finalText ? ' ' : '') + ev.results[i][0].transcript.trim();
          else interim += ev.results[i][0].transcript;
        }
        const said = (finalText + (interim ? ' ' + interim : '')).trim();
        field.value = opts.append && before ? before + t('sep') + said : said;
      };
      rec.onerror = ev => { if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') note(t('micDenied')); };
      rec.onend = () => {
        active = null; listening = false; idle(); field.placeholder = t(field.dataset.ph);
        if (cancelled){ field.value = before; return; }
        if (finalText) opts.onDone();
      };
      try { rec.start(); active = btn; listening = true; btn.classList.add('on'); btn.textContent = t('micHolding'); field.placeholder = t('listeningNow'); note(t('slideCancel')); }
      catch { holding = false; idle(); }
    });
    const release = cancel => () => {
      if (!holding) return;
      holding = false;
      const tooShort = Date.now() - pressedAt < 400;
      if (cancel || tooShort){
        cancelled = true;
        try { rec.abort(); } catch { stop(); }
        note(tooShort && !cancel ? t('holdHint') : t('cancelled'));
        return;
      }
      note('');
      stop();
    };
    btn.addEventListener('pointermove', e => { if (holding && Math.hypot(e.clientX - x0, e.clientY - y0) > 70) release(true)(); });
    btn.addEventListener('pointerup', release(false));
    btn.addEventListener('pointercancel', release(true));
  };
  setup($('micBtn'), { field: 'draft', append: true, msg: 'listBusy', onDone: () => $('addBtn').click() });
  setup($('chatMic'), { field: 'chatIn', msg: 'chatHint', onDone: () => { replyByVoice = true; sendChat(); } });
}

  [db, sample, user] = await Promise.all([use('db'), use('sample'), use('user')]);
  if (!sample) sample = false;
  if (user){ canEdit = !!(await user.canEdit()); uid = await user.id(); }
  $('adminBox').hidden = !canEdit;
  if (sb){
    const { data: { user: u } } = await sb.auth.getUser();
    const isReal = u && !u.is_anonymous && u.email;
    $('loginBox').hidden = !!isReal; $('logoutRow').hidden = !isReal;
    if (isReal) $('whoAmI').textContent = t('loggedAs', u.email) + (canEdit ? '' : ' · ' + t('notAdmin'));
  }
  if (sample){
    $('photoLbl').hidden = false;
    try { if (!(await sample.limits()).images) $('photoLbl').hidden = true; } catch {}
  }
  renderChat();
  if (!db){
    offers = DEMO.map((o, i) => ({ id: 'demo' + i, ...o })); renderOffers(); renderList();
    try { const s = JSON.parse(localStorage.getItem('ration-list') || '[]'); if (Array.isArray(s) && !items.length){ items = s.filter(i => i && i.text).map(i => ({ text: String(i.text), quantity: +i.quantity || 1 })); renderList(); } } catch {}
    return;
  }
  const timer = setTimeout(() => { if (!offers.length) offerMsg('slow'); }, 10000);
  db.collection('offers').onSnapshot(snap => {
    if (!snap.metadata.fromCache){ clearTimeout(timer); delete $('offerList').dataset.msg; }
    offers = snap.docs.map(d => { const x = d.data(); return { id: d.id, store: String(x.store || ''), name: String(x.name || ''), brand: x.brand || null, size: x.size || null,
      price: +x.price || 0, oldPrice: +x.oldPrice || null, until: x.until || null, source: x.source || '',
      image: typeof x.image === 'string' ? x.image : null, box: Array.isArray(x.box) && x.box.length === 4 ? x.box.map(Number) : null }; }).filter(o => o.price > 0 && o.store);
    renderOffers(); renderList();
  }, () => { clearTimeout(timer); offerMsg('loadFail'); });
  if (uid){
    try { const s = await db.doc(`data/users/${uid}/list`).get(); if (s.exists && Array.isArray(s.data().items) && !items.length){ items = s.data().items.map(i => ({ text: String(i.text || ''), quantity: +i.quantity || 1 })).filter(i => i.text); renderList(); } } catch {}
  }
})();
(async () => {
  const d = await use('dictation'); if (!d){ browserVoice(); return; }
  const mic = $('micBtn'); mic.hidden = false;
  d.onFinal(({ text }) => { const el = $('draft'); el.value = (el.value ? el.value + t('sep') : '') + text; });
  d.onState(({ state }) => { listening = state === 'listening'; mic.classList.toggle('on', listening); mic.textContent = listening ? t('micStop') : t('mic'); });
  mic.onclick = () => { if (listening) d.stop().catch(() => {}); else d.start().catch(e => { if (e && e.code === 'not_granted') mic.hidden = true; }); };
})();
}
</script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
