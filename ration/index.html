<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D7261E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="وفرلي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>وفرلي | Wafrly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a friendly neighbourhood-flyer voice — quick, clear, money-first.
   IDEA: the app behaves like a supermarket promo flyer: red band, yellow price tags.
   PICTURE: the working list + price tags are the picture; prices sit in tag shapes.
   COLOUR and TYPE: flyer red #D7261E, tag yellow #FFD23F, ink; Cairo 800 for prices.
   LAYOUT: one phone-width column, red header band, bottom tab bar. */
:root{color-scheme:light dark;
--bg:light-dark(#F6F4F1,#141211);--card:light-dark(#FFFFFF,#1F1C1A);--ink:light-dark(#1D1A17,#F3EFEA);
--muted:light-dark(#6E675F,#A8A097);--line:light-dark(#E7E2DB,#34302C);--red:#D7261E;--redSoft:light-dark(#FCE6E4,#3A1A18);
--tag:#FFD23F;--tagInk:#1D1A17;--green:light-dark(#127A4B,#4CC38A)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Cairo,Tahoma,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--red);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 22px;display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:32px;line-height:1.05;font-weight:800}
header h1 span{font-size:22px;font-weight:700;opacity:.85}
header p{margin:2px 0 0;font-size:14px;opacity:.9}
.hside{margin-inline-start:auto;display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.lang{min-height:36px;border:2px solid #fff;background:transparent;color:#fff;border-radius:18px;padding:0 14px;font-weight:800;cursor:pointer}
main{flex:1;padding:16px 16px 96px}
.view{display:none}.view.on{display:block}
h2{font-size:20px;margin:4px 0 10px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.muted{color:var(--muted);font-size:14px}
.note{background:var(--redSoft);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
textarea,input,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}
textarea{min-height:56px;resize:vertical}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{min-height:46px;border:0;border-radius:12px;padding:0 16px;font-weight:700;cursor:pointer;background:var(--redSoft);color:var(--red)}
.btn.main{background:var(--red);color:#fff;width:100%;font-size:17px;margin-top:12px}
.btn[disabled]{opacity:.5;cursor:default}
.grow{flex:1}
.item{display:flex;align-items:center;gap:8px}
.item .name{flex:1;font-weight:600}
.qty{display:flex;align-items:center;gap:4px}
.qty button,.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:700}
.x{color:var(--red);border-color:transparent}
.tag{display:inline-flex;align-items:center;background:var(--tag);color:var(--tagInk);font-weight:800;border-radius:8px 4px 4px 8px;padding:2px 10px 2px 8px;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--card);margin-inline-end:6px}
.old{text-decoration:line-through;color:var(--muted);font-size:13px;white-space:nowrap}
.big{font-size:clamp(30px,8vw,40px);font-weight:800;line-height:1.1}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;min-height:44px;border-radius:10px;border:0;background:var(--redSoft);color:var(--red);font-weight:700;cursor:pointer}
.tabs button.on{background:var(--red);color:#fff}
.line{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px dashed var(--line)}
.line:first-of-type{border-top:0}
.save{color:var(--green);font-weight:700}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;min-height:62px;border:0;background:transparent;cursor:pointer;color:var(--muted);font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button.on{color:var(--red)}
nav svg{width:22px;height:22px}
.bubble{max-width:88%;padding:10px 12px;border-radius:14px;margin-bottom:8px;white-space:pre-wrap}
.bubble.me{background:var(--redSoft);margin-inline-start:auto}
.bubble.ai{background:var(--card);border:1px solid var(--line)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:s 1s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.store{font-weight:800;margin:14px 0 6px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.mic.on{background:var(--red);color:#fff}
.thumb{width:56px;height:56px;flex:none;border-radius:10px;overflow:hidden;position:relative;background:#fff;border:1px solid var(--line)}
.thumb img{position:absolute;max-width:none;left:0;top:0;opacity:0;transition:opacity .2s}
.thumb img.ok{opacity:1}
.rowi{display:flex;gap:10px;align-items:center}
.say{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:36px;margin-top:6px;border:1px solid var(--line);border-radius:10px;background:transparent;cursor:pointer;font-size:16px}
.say.on{background:var(--redSoft);border-color:var(--red)}
</style>
</head>
<body>
<div class="app">
<header>
  <div>
    <h1 id="brand"></h1>
    <p data-i="tagline"></p>
  </div>
  <div class="hside">
    <svg width="54" height="54" viewBox="0 0 64 64" aria-hidden="true"><path d="M8 30 30 8h22a4 4 0 0 1 4 4v22L34 56a4 4 0 0 1-6 0L8 36a4 4 0 0 1 0-6z" fill="#FFD23F"/><path d="M8 30 30 8h8L14 36z" fill="#fff" opacity=".35"/><circle cx="44" cy="20" r="5" fill="#D7261E"/><text x="30" y="40" font-family="Cairo" font-weight="800" font-size="15" fill="#1D1A17" text-anchor="middle" transform="rotate(-45 30 36)">%</text></svg>
    <button class="lang" id="langBtn"></button>
  </div>
</header>

<main>
  <section class="view on" id="v-list">
    <div id="demoNote" class="note" hidden data-i="demoNote"></div>
    <label for="draft" class="muted" data-i="addLabel"></label>
    <textarea id="draft" data-ph="draftPh"></textarea>
    <div class="row" style="margin-top:8px">
      <button class="btn grow" id="addBtn" data-i="add"></button>
      <button class="btn mic" id="micBtn" hidden></button>
      <label class="btn" id="photoLbl" style="display:inline-flex;align-items:center" hidden><span data-i="photo"></span><input type="file" id="listPhoto" accept="image/*" hidden></label>
    </div>
    <div id="listBusy" class="muted" style="margin-top:8px"></div>
    <h2 style="margin-top:18px"><span data-i="myList"></span> <span class="muted" id="count"></span></h2>
    <div id="items"></div>
    <button class="btn main" id="findBtn" data-i="find"></button>
  </section>

  <section class="view" id="v-results"><div id="results"></div></section>

  <section class="view" id="v-chat">
    <div id="chatLog"></div>
    <div class="row" style="position:sticky;bottom:76px;background:var(--bg);padding-top:8px">
      <input id="chatIn" class="grow" data-ph="askPh" autocomplete="off">
      <button class="btn mic" id="chatMic" hidden data-i="micShort"></button>
      <button class="btn" id="chatSend" style="background:var(--red);color:#fff" data-i="send"></button>
    </div>
  </section>

  <section class="view" id="v-offers">
    <div id="adminBox" hidden>
      <h2 data-i="addOffers"></h2>
      <p class="muted" data-i="addOffersHint"></p>
      <label class="muted" for="storeIn" data-i="store"></label>
      <input id="storeIn" list="storeList" data-ph="storePh">
      <datalist id="storeList"></datalist>
      <label class="muted" for="untilIn" style="display:block;margin-top:8px" data-i="validUntil"></label>
      <input id="untilIn" type="date">
      <label class="btn main" style="display:flex;align-items:center;justify-content:center"><span data-i="pickFlyer"></span><input type="file" id="flyerIn" accept="image/*" multiple hidden></label>
      <div id="flyerBusy" class="muted" style="margin-top:8px"></div>
      <div id="preview"></div>
    </div>
    <div id="loginBox" class="card" hidden>
      <b data-i="adminLogin"></b>
      <p class="muted" data-i="adminLoginHint"></p>
      <input id="emailIn" type="email" autocomplete="email" data-ph="emailPh" style="margin-bottom:8px">
      <input id="passIn" type="password" autocomplete="current-password" data-ph="passPh">
      <div class="row" style="margin-top:8px"><button class="btn grow" id="loginBtn" data-i="login"></button><button class="btn" id="signupBtn" data-i="signup"></button></div>
      <div id="loginMsg" class="muted" style="margin-top:6px"></div>
    </div>
    <div id="logoutRow" class="row" hidden style="margin-top:10px"><span class="muted grow" id="whoAmI"></span><button class="btn" id="logoutBtn" data-i="logout"></button></div>
    <h2 style="margin-top:20px"><span data-i="savedOffers"></span> <span class="muted" id="offerCount"></span></h2>
    <div class="row" id="demoTools" hidden><button class="btn" id="clearDemo" data-i="clearDemo"></button></div>
    <div id="offerList"></div>
  </section>
</main>

<nav><div class="in">
  <button data-v="list" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span data-i="tabList"></span></button>
  <button data-v="results"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11 12 2h8a2 2 0 0 1 2 2v8l-9 9a2 2 0 0 1-3 0l-7-7a2 2 0 0 1 0-3z"/><circle cx="17" cy="7" r="1.5"/></svg><span data-i="tabResults"></span></button>
  <button data-v="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-12 7l-6 2 2-5a8 8 0 1 1 16-4z"/></svg><span data-i="tabChat"></span></button>
  <button data-v="offers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4zM4 9h16M9 9v11"/></svg><span data-i="tabOffers"></span></button>
</div></nav>
</div>

<script src="vendor/supabase-2.118.0.js"></script>

{

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- language ---------- */

  emailPh: 'البريد الإلكتروني', passPh: 'كلمة السر (٨ أحرف أو أكثر)', login: 'دخول', signup: 'حساب جديد', logout: 'خروج',

try { const saved = localStorage.getItem('ration-lang'); if (saved === 'ar' || saved === 'en') lang = saved; } catch {}
const t = (k, ...a) => { const v = T[lang][k]; return typeof v === 'function' ? v(...a) : v; };
const storeName = s => lang === 'en' && STORE_EN[s] ? STORE_EN[s] : s;
const aed = n => n == null ? '-' : lang === 'ar' ? n.toFixed(2) + ' ' + t('cur') : t('cur') + ' ' + n.toFixed(2);

function applyLang(){
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = lang === 'ar' ? 'وفرلي | Wafrly' : 'Wafrly | وفرلي';
  $('brand').innerHTML = `${esc(t('brandMain'))} <span dir="${lang === 'ar' ? 'ltr' : 'rtl'}">${esc(t('brandSub'))}</span>`;
  $('langBtn').textContent = t('langBtn');
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = t(el.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = t(el.dataset.ph));
  $('micBtn').textContent = listening ? t('micStop') : t('mic');
  renderList(); renderOffers(); renderChat();
  if (report) renderResults(); else $('results').innerHTML = `<div class="empty">${esc(t('resultsEmpty'))}</div>`;
}
$('langBtn').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('ration-lang', lang); } catch {} applyLang(); };

async function toB64(file){
  const img = await createImageBitmap(file);
  const k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return { media_type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] };
}
function supaSample(){
  const call = async body => {
    const { data, error } = await sb.functions.invoke('ai', { body });
    if (error) throw error; if (data && data.error) throw new Error(data.error); return data;
  };
  const fn = async (msgs, opts = {}) => {
    const tools = opts.tools || [];
    const apiTools = tools.map(x => ({ name: x.name, description: x.description, input_schema: x.inputSchema || { type: 'object', properties: {} } }));
    const m = msgs.map(x => ({ role: x.role, content: x.content }));
    for (let i = 0; i < 6; i++){
      const r = await call({ mode: 'messages', messages: m, tools: apiTools, tier: opts.modelTier });
      if (r.stop_reason !== 'tool_use'){
        const text = (r.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
        opts.onText && opts.onText({ text }); return { text };
      }
      m.push({ role: 'assistant', content: r.content });
      const results = [];
      for (const b of r.content) if (b.type === 'tool_use'){
        const tool = tools.find(x => x.name === b.name); let out;
        try { out = tool ? await tool.execute(b.input) : { error: 'unknown tool' }; } catch (e) { out = { error: String(e) }; }
        results.push({ type: 'tool_result', tool_use_id: b.id, content: JSON.stringify(out) });
      }
      m.push({ role: 'user', content: results });
    }
    return { text: '' };
  };
  fn.json = async (prompt, opts = {}) => {
    const images = []; for (const f of opts.images || []) images.push(await toB64(f));
    return (await call({ mode: 'json', prompt, images, tier: opts.modelTier })).value;
  };
  fn.limits = async () => ({ images: true });
  return fn;
}

/* ---------- text matching ---------- */
function norm(s){
  return String(s || '').toLowerCase()
    .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x660)
    .replace(/[ً-ْ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
    .replace(/(\d)\s*(لتر|ltr|litre|liter|l)\b/g, '$1l').replace(/(\d)\s*(كيلو|كغ|كجم|kg)/g, '$1kg')
    .replace(/(\d)\s*(مل|ml)\b/g, '$1ml').replace(/(\d)\s*(جرام|غرام|غ|gm|g)\b/g, '$1g');
}
const toks = s => norm(s).split(/[^\p{L}\p{N}.]+/u).filter(x => x.length > 1 || /\d/.test(x));
const offerText = o => [o.brand, o.name, o.size].filter(Boolean).join(' ');
function localScore(q, o){
  const a = toks(q), b = new Set(toks(offerText(o)));
  if (!a.length) return 0;
  return a.filter(x => b.has(x)).length / a.length;
}
function localSearch(q, n = 12){
  return offers.map(o => [localScore(q, o), o]).filter(x => x[0] >= 0.5)
    .sort((x, y) => y[0] - x[0] || x[1].price - y[1].price).slice(0, n).map(x => x[1]);
}

/* ---------- basket math ---------- */
function cheapestPerStore(list){ const m = {}; for (const o of list) if (!m[o.store] || o.price < m[o.store].price) m[o.store] = o; return m; }
function costFor(basket, stores){
  let total = 0, covered = 0; const missing = [], lines = [];
  for (const it of basket){
    const per = cheapestPerStore(it.offers), opts = stores.filter(s => per[s]).map(s => per[s]);
    if (!opts.length){ missing.push(it.text); continue; }
    const o = opts.reduce((a, b) => b.price < a.price ? b : a);
    covered++; total += o.price * it.quantity;
    lines.push({ item: it.text, qty: it.quantity, store: o.store, price: o.price, total: o.price * it.quantity, until: o.until, image: o.image, box: o.box });
  }
  return { stores, total: Math.round(total * 100) / 100, covered, missing, lines };
}
const rank = arr => arr.sort((a, b) => b.covered - a.covered || a.total - b.total);
function buildReport(basket){
  const stores = [...new Set(basket.flatMap(it => it.offers.map(o => o.store)))];
  const single = rank(stores.map(s => costFor(basket, [s])));
  const combos = [...stores.map(s => [s])];
  for (let i = 0; i < stores.length; i++) for (let j = i + 1; j < stores.length; j++) combos.push([stores[i], stores[j]]);
  const best = stores.length ? rank(combos.map(c => costFor(basket, c)))[0] : null;
  if (best && single[0] && single[0].covered === best.covered) best.saving = Math.round((single[0].total - best.total) * 100) / 100;
  const perItem = basket.map(it => {
    if (!it.offers.length) return { item: it.text, qty: it.quantity, found: false };
    const o = it.offers.reduce((a, b) => b.price < a.price ? b : a);
    return { item: it.text, qty: it.quantity, found: true, store: o.store, price: o.price, old: o.oldPrice, total: o.price * it.quantity, until: o.until, name: offerText(o), image: o.image, box: o.box };
  });
  return { single, best, perItem, count: basket.length };
}

const thumb = o => (o && o.image && /^https:\/\/cdn\.clicflyer\.net\//.test(o.image) && o.box)
  ? `<span class="thumb"><img class="crop" src="${esc(o.image)}" data-box="${o.box.map(n => +n).join(',')}" alt="" loading="lazy" referrerpolicy="no-referrer"></span>` : '';
document.addEventListener('load', e => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.classList.contains('crop')) return;
  const [x0, y0, x1, y1] = img.dataset.box.split(',').map(n => +n / 1000);
  const W = img.naturalWidth, H = img.naturalHeight, T = img.parentElement.clientWidth || 56;
  const w = (x1 - x0) * W, hgt = (y1 - y0) * H, k = T / Math.max(w, hgt);
  img.style.width = W * k + 'px';
  img.style.left = (-x0 * W * k + (T - w * k) / 2) + 'px';
  img.style.top = (-y0 * H * k + (T - hgt * k) / 2) + 'px';
  img.classList.add('ok');
}, true);
document.addEventListener('error', e => { const img = e.target; if (img instanceof HTMLImageElement && img.classList.contains('crop')) img.parentElement.remove(); }, true);

async function matchItems(){
  if (sample && offers.length){
    const cat = offers.slice(0, 600).map((o, i) => `${i}|${o.store}|${offerText(o)}|${o.price}`).join('\n');
    const prompt = `You match a UAE shopping list (Arabic or English) against supermarket offers (Arabic or English).
For each list item, give the numbers of the offers that are the same product the customer would accept:
- Same product type. If the customer names a brand, keep to it; if not, any brand is fine.
- Size close to what was asked (2L accepts "2 لتر", not 200ml). If no size, accept usual sizes.
Return JSON only: {"matches":[[numbers for item 0],[numbers for item 1],...]} in list order and the same length.

List:
${items.map((it, i) => `${i}. ${it.text}`).join('\n')}

Offers (number|store|product|price):
${cat}`;
    try {
      const r = await sample.json(prompt, { modelTier: 'quick' });
      if (Array.isArray(r.matches) && r.matches.length === items.length)
        return items.map((it, i) => ({ ...it, offers: (r.matches[i] || []).map(n => offers[+n]).filter(Boolean) }));
    } catch {}
  }
  return items.map(it => ({ ...it, offers: localSearch(it.text, 30) }));
}

  } else if (resTab === 'single'){
    h += r.single.map((s, i) => `<div class="card"><div class="line" style="border:0"><b>${i === 0 ? '⭐ ' : ''}${esc(storeName(s.stores[0]))}</b><span class="tag">${aed(s.total)}</span></div>
      <div class="muted">${esc(t('ofAvail', s.covered, r.count))}${s.missing.length ? ' · ' + esc(t('missing')) + ': ' + s.missing.map(esc).join(sep) : ''}</div></div>`).join('') || `<div class="empty">${esc(t('noResults'))}</div>`;
  } else {
    h += r.perItem.map(p => `<div class="card"><div class="line" style="border:0"><span class="rowi">${thumb(p)}<b>${esc(p.item)} × ${p.qty}</b></span>${p.found ? `<span class="tag">${aed(p.total)}</span>` : `<span class="muted">${esc(t('noOffer'))}</span>`}</div>
      ${p.found ? `<div class="muted">${esc(storeName(p.store))} · ${esc(p.name)} · ${aed(p.price)} ${esc(t('each'))} ${p.old ? `<span class="old">${aed(p.old)}</span>` : ''}${p.until ? ' · ' + esc(t('until')) + ' ' + esc(p.until) : ''}</div>` : ''}</div>`).join('');
  }
  $('results').innerHTML = h;
}
$('results').onclick = e => { const b = e.target.closest('[data-t]'); if (b){ resTab = b.dataset.t; renderResults(); } };

/* ---------- assistant ---------- */
const sys = () => lang === 'ar'
  ? `أنت "وفرلي"، مساعد تسوق في الإمارات. تساعد الزبون يلقى أرخص العروض في الجمعيات والسوبرماركتات.
- استخدم الأداة search_offers لكل سعر. لا تخترع أي سعر أو محل أو عرض.
- رد بالعربي بلهجة إماراتية بسيطة ومختصرة، واذكر المحل والسعر ونهاية العرض إذا موجودة.
- إذا ما في عرض على منتج، قول ذلك بوضوح.`
  : `You are "Wafrly", a shopping assistant in the UAE. You help the customer find the cheapest offers at co-ops and supermarkets.
- Use the search_offers tool for every price. Never invent a price, store or offer.
- Reply in clear, short English. Mention the store, price and offer end date when known. Store and product names may be in Arabic; translate them.
- If there is no offer for a product, say so plainly.`;
/* ---------- spoken replies (the device's own text-to-speech) ---------- */
const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let speakingIdx = -1;
function speak(text, idx = -1){
  if (!canSpeak || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[*_#`>]/g, ''));
  u.lang = lang === 'ar' ? 'ar-AE' : 'en-US';
  const voices = speechSynthesis.getVoices();
  u.voice = voices.find(v => v.lang === u.lang) || voices.find(v => v.lang && v.lang.startsWith(u.lang.slice(0, 2))) || null;
  u.rate = lang === 'ar' ? 0.95 : 1;
  speakingIdx = idx;
  u.onend = u.onerror = () => { speakingIdx = -1; renderChat(); };
  speechSynthesis.speak(u);
  renderChat();
}
function unlockSpeech(){ // iPhone only lets a page talk after a tap
  if (canSpeak && !unlockSpeech.done){ unlockSpeech.done = true; speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); }
}
let replyByVoice = false;

function renderChat(){
  $('chatLog').innerHTML = chat.length ? chat.map((m, i) => `<div class="bubble ${m.role === 'user' ? 'me' : 'ai'}">${m.content ? esc(m.content) : '<span class="spin"></span>'}${
      m.role === 'assistant' && m.content && canSpeak ? `<br><button class="say${speakingIdx === i ? ' on' : ''}" data-say="${i}" aria-label="${t('listen')}">${speakingIdx === i ? '⏹' : '🔊'}</button>` : ''}</div>`).join('')
    : `<div class="empty">${esc(sample === false ? t('chatOff') : t('chatEmpty'))}</div>`;
}
async function sendChat(){
  const q = $('chatIn').value.trim(); if (!q || !sample) return;
  $('chatIn').value = ''; chat.push({ role: 'user', content: q }); const ans = { role: 'assistant', content: '' }; chat.push(ans); renderChat();
  const hist = chat.slice(0, -1).slice(-16);
  while (hist.length && hist[0].role !== 'user') hist.shift();
  const msgs = hist.map((m, i) => ({ role: m.role, content: i === 0 ? sys() + '\n\n' + m.content : m.content }));
  try {
    const r = await sample(msgs, { cache: false, modelTier: 'quick', onText: ({ text }) => { ans.content = text; renderChat(); },
      tools: [{ name: 'search_offers', description: 'Search saved supermarket offers by product name (Arabic or English). Returns matching offers with store, price, old price and end date.',
        inputSchema: { type: 'object', properties: { query: { type: 'string' } }, required: ['query'] },
        execute: ({ query }) => { let hits = localSearch(query, 15); if (!hits.length) hits = offers.slice(0, 200);
          return hits.map(o => ({ store: o.store, store_en: STORE_EN[o.store] || null, product: offerText(o), price: o.price, old_price: o.oldPrice || null, until: o.until || null })); } }] });
    ans.content = r.text || ans.content || t('noAnswer');
    if (replyByVoice){ replyByVoice = false; renderChat(); speak(ans.content, chat.indexOf(ans)); }
  } catch (e) { ans.content = e && e.code === 'rate_limited' ? t('busy') : t('error'); }
  renderChat();
}
$('chatSend').onclick = sendChat;
$('chatIn').onkeydown = e => { if (e.key === 'Enter') sendChat(); };

/* ---------- offers admin ---------- */
function renderOffers(){
  $('offerCount').textContent = offers.length ? `(${offers.length})` : '';
  const demo = offers.some(o => o.source === 'demo');
  $('demoNote').hidden = !demo; $('demoTools').hidden = !(demo && canEdit);
  const stores = [...new Set([...DEFAULT_STORES, ...offers.map(o => o.store)])];
  $('storeList').innerHTML = stores.map(s => `<option value="${esc(s)}">`).join('');
  if (!offers.length){ if (!$('offerList').dataset.msg) $('offerList').innerHTML = `<div class="empty">${esc(t('noSaved'))}</div>`; return; }
  const by = {}; offers.forEach(o => (by[o.store] = by[o.store] || []).push(o));
  $('offerList').innerHTML = Object.keys(by).map(s => `<div class="store">${esc(storeName(s))} <span class="muted">(${by[s].length})</span></div>` +
    by[s].sort((a, b) => offerText(a).localeCompare(offerText(b), 'ar')).map(o => `<div class="card item">${thumb(o)}<span class="name">${esc(offerText(o))}${o.source === 'demo' ? ` <span class="muted">· ${esc(t('demo'))}</span>` : ''}<br><span class="muted">${o.until ? esc(t('until')) + ' ' + esc(o.until) : ''}</span></span>
      ${o.oldPrice ? `<span class="old">${aed(o.oldPrice)}</span>` : ''}<span class="tag">${aed(o.price)}</span>
      ${canEdit ? `<button class="x" data-off="${esc(o.id)}" aria-label="${t('del')}">✕</button>` : ''}</div>`).join('')).join('');
}
function offerMsg(k){ $('offerList').dataset.msg = k; $('offerList').innerHTML = `<div class="empty">${esc(t(k))}</div>`; }
$('offerList').onclick = async e => {
  const b = e.target.closest('[data-off]'); if (!b || !db) return;
  b.disabled = true; try { await db.doc('offers/' + b.dataset.off).delete(); } catch { b.disabled = false; }
};
$('clearDemo').onclick = async () => {
  const b = $('clearDemo'); b.disabled = true; b.textContent = t('deleting');
  for (const o of offers.filter(o => o.source === 'demo')) { try { await db.doc('offers/' + o.id).delete(); } catch {} }
  b.disabled = false; b.textContent = t('clearDemo');
};
const FLYER_PROMPT = `This is a page of a UAE supermarket promotional flyer. Extract every product that has a clear price.
Return JSON only:
{"valid_to":"YYYY-MM-DD or null","offers":[{"name":"product name exactly as printed","brand":"brand or null","size":"e.g. 2L, 1kg, 1L x 4 or null","price":12.95,"original_price":15.5}]}
- price is the promotional price the customer pays, in AED. A price printed as 12^95 is 12.95.
- original_price is the price before discount, or null.
- Skip anything without a clear price. Never invent products or prices.`;
function renderPreview(){
  if (!extracted.length){ $('preview').innerHTML = ''; return; }
  $('preview').innerHTML = `<h2 style="margin-top:14px">${esc(t('foundN', extracted.length))}</h2>` +
    extracted.map((o, i) => `<div class="card item"><span class="name">${esc(offerText(o))}</span>${o.oldPrice ? `<span class="old">${aed(o.oldPrice)}</span>` : ''}<span class="tag">${aed(o.price)}</span><button class="x" data-rm="${i}" aria-label="${t('del')}">✕</button></div>`).join('') +
    `<button class="btn main" id="saveOffers">${esc(t('saveN', extracted.length))}</button>`;
}
$('preview').onclick = async e => {
  const rm = e.target.closest('[data-rm]');
  if (rm){ extracted.splice(+rm.dataset.rm, 1); renderPreview(); return; }
  if (e.target.id !== 'saveOffers' || !db) return;
  const b = e.target; b.disabled = true; let n = 0;
  for (const o of extracted){
    try { await db.collection('offers').add({ ...o, createdAt: new Date().toISOString() }); n++; b.textContent = t('savingN', n); }
    catch (err) { $('flyerBusy').textContent = err && err.code === 'quota_exceeded' ? t('full') : t('saveFail'); break; }
  }
  extracted = extracted.slice(n); renderPreview(); if (!extracted.length) $('flyerBusy').textContent = t('savedN', n);
};
$('flyerIn').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  const store = $('storeIn').value.trim();
  if (!store){ $('flyerBusy').textContent = t('storeFirst'); return; }
  if (!files.length || !sample) return;
  let failed = '';
  for (let i = 0; i < files.length; i++){
    $('flyerBusy').innerHTML = spin(t('readingPage', i + 1, files.length));
    try {
      const r = await sample.json(FLYER_PROMPT, { images: [files[i]], modelTier: 'complex' });
      const until = $('untilIn').value || r.valid_to || null;
      for (const o of r.offers || []){
        const price = +o.price; if (!o.name || !(price > 0)) continue;
        extracted.push({ store, name: String(o.name).slice(0, 120), brand: o.brand || null, size: o.size || null, price,
          oldPrice: +o.original_price > price ? +o.original_price : null, until, source: 'flyer' });
      }
    } catch { failed = t('pageFail', i + 1); }
    renderPreview();
  }
  $('flyerBusy').textContent = failed;
};

/* ---------- admin sign-in (Supabase only) ---------- */
async function authAct(kind){
  const email = $('emailIn').value.trim(), password = $('passIn').value;
  if (!email || password.length < 8){ $('loginMsg').textContent = t('loginFail'); return; }
  $('loginMsg').innerHTML = spin('');
  const r = kind === 'up' ? await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.href.split('#')[0] } })
                          : await sb.auth.signInWithPassword({ email, password });
  if (r.error){ $('loginMsg').textContent = r.error.message || t('loginFail'); return; }
  if (kind === 'up' && !r.data.session){ $('loginMsg').textContent = t('checkEmail'); return; }
  location.reload();
}
$('loginBtn').onclick = () => authAct('in');
$('signupBtn').onclick = () => authAct('up');
$('logoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };

/* ---------- voice input with the browser's own speech recognition (Chrome, Edge, Safari) ---------- */
function browserVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  // one recogniser at a time; each button says where the words go and what happens at the end
  let rec = null, active = null;
  const stop = () => { try { rec && rec.stop(); } catch {} };
  const setup = (btn, opts) => {
    btn.hidden = false;
    const idle = () => { btn.classList.remove('on'); btn.textContent = btn.id === 'micBtn' ? t('mic') : t('micShort'); };
    idle();
    btn.onclick = () => {
      if (active === btn){ stop(); return; }
      stop();
      rec = new SR();
      rec.lang = lang === 'ar' ? 'ar-AE' : 'en-US';
      rec.interimResults = true; rec.continuous = btn.id === 'micBtn';
      const field = $(opts.field), start = field.value;
      let finalText = '';
      rec.onresult = e => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++){
          if (e.results[i].isFinal) finalText += (finalText ? ' ' : '') + e.results[i][0].transcript.trim();
          else interim += e.results[i][0].transcript;
        }
        const said = (finalText + (interim ? ' ' + interim : '')).trim();
        field.value = opts.append && start ? start + t('sep') + said : said;
      };
      rec.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){ (opts.msg ? $(opts.msg) : null) && ($(opts.msg).textContent = t('micDenied')); } };
      rec.onend = () => { active = null; idle(); listening = false; field.placeholder = t(field.dataset.ph); if (opts.onDone && finalText) opts.onDone(); };
      try { rec.start(); active = btn; listening = btn.id === 'micBtn'; btn.classList.add('on'); btn.textContent = t('micStop'); field.placeholder = t('listeningNow'); }
      catch { active = null; idle(); }
    };
  };
  setup($('micBtn'), { field: 'draft', append: true, msg: 'listBusy' });
  setup($('chatMic'), { field: 'chatIn', onDone: () => { replyByVoice = true; sendChat(); } });
  $('chatMic').addEventListener('click', unlockSpeech);
}

$('chatLog').addEventListener('click', e => {
  const b = e.target.closest('[data-say]'); if (!b) return;
  const i = +b.dataset.say;
  if (speakingIdx === i){ speechSynthesis.cancel(); speakingIdx = -1; renderChat(); return; }
  speak(chat[i] && chat[i].content, i);
});
if (canSpeak) speechSynthesis.getVoices();

/* ---------- boot ---------- */
applyLang();
(async () => {
  [db, sample, user] = await Promise.all([use('db'), use('sample'), use('user')]);
  if (!sample) sample = false;
  if (user){ canEdit = !!(await user.canEdit()); uid = await user.id(); }
  $('adminBox').hidden = !canEdit;
  if (sb){
    const { data: { user: u } } = await sb.auth.getUser();
    const isReal = u && !u.is_anonymous && u.email;
    $('loginBox').hidden = !!isReal; $('logoutRow').hidden = !isReal;
    if (isReal) $('whoAmI').textContent = t('loggedAs', u.email) + (canEdit ? '' : ' · ' + t('notAdmin'));
  }
  if (sample){
    $('photoLbl').hidden = false;
    try { if (!(await sample.limits()).images) $('photoLbl').hidden = true; } catch {}
  }
  renderChat();
  if (!db){
    offers = DEMO.map((o, i) => ({ id: 'demo' + i, ...o })); renderOffers();
    try { const s = JSON.parse(localStorage.getItem('ration-list') || '[]'); if (Array.isArray(s) && !items.length){ items = s.filter(i => i && i.text).map(i => ({ text: String(i.text), quantity: +i.quantity || 1 })); renderList(); } } catch {}
    return;
  }
  const timer = setTimeout(() => { if (!offers.length) offerMsg('slow'); }, 10000);
  db.collection('offers').onSnapshot(snap => {
    if (!snap.metadata.fromCache){ clearTimeout(timer); delete $('offerList').dataset.msg; }
    offers = snap.docs.map(d => { const x = d.data(); return { id: d.id, store: String(x.store || ''), name: String(x.name || ''), brand: x.brand || null, size: x.size || null,
      price: +x.price || 0, oldPrice: +x.oldPrice || null, until: x.until || null, source: x.source || '',
      image: typeof x.image === 'string' ? x.image : null, box: Array.isArray(x.box) && x.box.length === 4 ? x.box.map(Number) : null }; }).filter(o => o.price > 0 && o.store);
    renderOffers();
  }, () => { clearTimeout(timer); offerMsg('loadFail'); });
  if (uid){
    try { const s = await db.doc(`data/users/${uid}/list`).get(); if (s.exists && Array.isArray(s.data().items) && !items.length){ items = s.data().items.map(i => ({ text: String(i.text || ''), quantity: +i.quantity || 1 })).filter(i => i.text); renderList(); } } catch {}
  }
})();
(async () => {
  const d = await use('dictation'); if (!d){ browserVoice(); return; }
  const mic = $('micBtn'); mic.hidden = false;
  d.onFinal(({ text }) => { const el = $('draft'); el.value = (el.value ? el.value + t('sep') : '') + text; });
  d.onState(({ state }) => { listening = state === 'listening'; mic.classList.toggle('on', listening); mic.textContent = listening ? t('micStop') : t('mic'); });
  mic.onclick = () => { if (listening) d.stop().catch(() => {}); else d.start().catch(e => { if (e && e.code === 'not_granted') mic.hidden = true; }); };
})();
}
